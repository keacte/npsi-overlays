<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NPSI.ROCKS – Current Ship</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* OBS Browser Source: width 560, height 200 (any size with the same ratio works), transparent background */
:root{
  --steel:#a65cff;--steel-dim:#4b2a80;--text:#f4eeff;--head:'Oxanium','Eurostile','Segoe UI',sans-serif;
  --purple:#8a3ffc;--violet:#b98bff;--glow:#a35cff;--dim:#2a1747;--white:#f4efff;--orange:#f58a1f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:560px;height:200px;transform-origin:0 0;font-family:'Rajdhani','Segoe UI',sans-serif;color:var(--white)}
@keyframes blink{50%{opacity:.15}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes sweepx{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
@keyframes scan{to{top:200px}}
@keyframes shipin{from{opacity:0;transform:translateX(-50px) scale(.7);filter:blur(10px)}}
@keyframes txtin{from{opacity:0;transform:translateX(30px)}}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}

#card{position:absolute;inset:0;border:1px solid var(--purple);background:rgba(5,3,8,.72);overflow:hidden;
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}
#card:before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,transparent,var(--glow),transparent);animation:sweepx 3.6s ease-in-out infinite}
#card .beam{position:absolute;left:0;right:0;height:70px;top:-70px;pointer-events:none;background:linear-gradient(transparent,rgba(166,92,255,.14),transparent);animation:scan 5s linear infinite}
#card .grid{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(166,92,255,.05) 0 1px,transparent 1px 4px)}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 25% 50%,rgba(185,139,255,.8),transparent 60%);opacity:0;pointer-events:none}
#flash.go{animation:flash .9s ease-out}

#shipwrap{position:absolute;left:14px;top:10px;width:180px;height:180px;display:flex;align-items:center;justify-content:center}
#shipwrap svg{position:absolute;inset:0;overflow:visible}
.r1{transform-origin:90px 90px;animation:spin 30s linear infinite}
.r2{transform-origin:90px 90px;animation:spin 18s linear infinite reverse}
#ship{position:relative;width:150px;height:150px;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(163,92,255,.75))}
#ship3d{position:relative;display:none;width:176px;height:176px;filter:drop-shadow(0 0 14px rgba(163,92,255,.6))}
#ship3d.in{animation:shipin .9s cubic-bezier(.2,.8,.2,1) both}
#ship.in{animation:shipin .9s cubic-bezier(.2,.8,.2,1) both,bob 4s .9s ease-in-out infinite}

#info{position:absolute;left:206px;right:16px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
#info>*{animation:txtin .6s both}
#lab{display:flex;align-items:center;gap:10px;font:700 13px 'Orbitron';letter-spacing:4px;color:var(--violet)}
#lab i{width:9px;height:9px;border-radius:50%;background:var(--violet);box-shadow:0 0 10px var(--glow);animation:blink 1.4s steps(2) infinite}
#sname{font:800 46px/1 var(--head);text-shadow:0 0 20px rgba(166,92,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation-delay:.1s}
#scls{font:700 15px 'Orbitron';letter-spacing:3px;color:var(--orange);text-transform:uppercase;animation-delay:.18s}
#cust{font:600 18px 'Rajdhani';color:var(--violet);letter-spacing:.04em;animation-delay:.24s}
#pil{margin-top:6px;padding-top:6px;border-top:1px solid var(--dim);display:flex;justify-content:space-between;font:600 14px 'Orbitron';letter-spacing:3px;color:#a898c4;text-transform:uppercase;animation-delay:.3s}
#pil b{color:var(--white);font-weight:600}

#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:600 15px 'Orbitron';letter-spacing:5px;color:#7a6a9c;animation:blink 2.4s ease-in-out infinite;text-align:center;background:rgba(5,3,8,.72)}
#msg.login{animation:none;flex-direction:column;gap:10px}
#msg .err{display:block;font:600 14px/1.3 'Rajdhani';letter-spacing:.04em;color:var(--orange);max-width:500px;padding:0 20px;text-transform:none}
#msg .cb{font:600 11px/1.3 'Rajdhani';letter-spacing:.05em;color:#7a6a9c;text-transform:none;word-break:break-all;padding:0 20px}
#lb{font:700 14px 'Orbitron';letter-spacing:4px;color:#fff;background:var(--purple);border:1px solid var(--violet);padding:10px 20px;cursor:pointer;box-shadow:0 0 18px rgba(163,92,255,.5)}
#lb:hover{background:var(--steel)}
</style>
</head>
<body>
<div id="stage">
  <div id="card">
    <div class="grid"></div><div class="beam"></div><div id="flash"></div>
    <div id="shipwrap">
      <svg viewBox="0 0 180 180" fill="none" stroke="#8a3ffc">
        <g class="r1"><circle cx="90" cy="90" r="88" stroke-width="1.5" stroke-dasharray="3 9" opacity=".7"/><circle cx="90" cy="90" r="85" stroke-width="4" stroke-dasharray="55 200" stroke="#b98bff"/></g>
        <g class="r2"><circle cx="90" cy="90" r="76" stroke-width="2" stroke-dasharray="26 12 4 12" opacity=".8"/><circle cx="90" cy="90" r="73" stroke-width="5" stroke-dasharray="36 230" stroke="#a35cff"/></g>
      </svg>
      <img id="ship" alt=""><canvas id="ship3d" width="352" height="352"></canvas>
    </div>
    <div id="info">
      <div id="lab"><i></i><span id="labt">NOW FLYING</span></div>
      <div id="sname">—</div>
      <div id="scls"></div>
      <div id="cust"></div>
      <div id="pil"><span>PILOT</span><b id="pilot"></b></div>
    </div>
  </div>
  <div id="msg">LOADING…</div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
/* 3D ship viewer: spins the model around its vertical axis. Falls back to the 2D render if anything fails. */
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const cv=document.getElementById('ship3d'),img=document.getElementById('ship');
const dbg=m=>{if(new URLSearchParams(location.search).has('debug')){let e=document.getElementById('dbg');if(!e){e=document.createElement('div');e.id='dbg';e.style.cssText='position:absolute;left:8px;bottom:4px;z-index:9;font:600 11px Rajdhani,sans-serif;color:#f58a1f;max-width:190px';document.getElementById('card').appendChild(e)}e.textContent='3D: '+m}};

let R;try{R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true})}catch(e){window.__wantModel=null;dbg('WebGL unavailable');throw e}
R.setPixelRatio(1);R.setSize(352,352,false);R.setClearColor(0x000000,0);
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.1;
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,1,.1,1000);
const pivot=new THREE.Group();scene.add(pivot);
scene.add(new THREE.HemisphereLight(0xcdb4ff,0x1a0b33,1.4));
const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(4,6,5);scene.add(key);
const rim=new THREE.DirectionalLight(0xa35cff,2.5);rim.position.set(-5,2,-4);scene.add(rim);
const SPIN=0.9;                         /* radians per second, about the vertical (Y) axis (about 7s per turn) */
let model=null,token=0,raf=0,last=0,loadedUrl=null;
const loader=new GLTFLoader();

function frame(t){
  raf=requestAnimationFrame(frame);
  const dt=Math.min(.1,(t-last)/1000||0);last=t;
  pivot.rotation.y+=SPIN*dt;
  R.render(scene,cam);
}
function show3d(on){
  cv.style.display=on?'block':'none';img.style.display=on?'none':'';
  if(on){cv.classList.remove('in');void cv.offsetWidth;cv.classList.add('in');if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}}
  else if(raf){cancelAnimationFrame(raf);raf=0}
}
function clear(){if(model){pivot.remove(model);model.traverse(o=>{o.geometry&&o.geometry.dispose()});model=null}}
async function apply(){
  const want=window.__wantModel,my=++token;
  if(!want){dbg('no model for this ship');show3d(false);return}
  if(want===loadedUrl&&model){show3d(true);return}
  try{
    dbg('loading '+want+'…');
    const g=await loader.loadAsync(new URL(want,location.href).href);
    if(my!==token)return;
    clear();model=g.scene;
    /* drop the file's own lights; we light the scene ourselves */
    const lights=[];model.traverse(o=>{if(o.isLight)lights.push(o)});lights.forEach(l=>l.parent.remove(l));
    const box=new THREE.Box3().setFromObject(model),c=box.getCenter(new THREE.Vector3()),sph=box.getBoundingSphere(new THREE.Sphere());
    model.position.sub(c);pivot.add(model);pivot.rotation.set(0,0,0);
    const d=sph.radius/Math.sin(THREE.MathUtils.degToRad(15))*0.9;
    cam.position.set(0,d*.32,d);cam.lookAt(0,0,0);
    loadedUrl=want;show3d(true);dbg('ok');
  }catch(e){dbg('FAILED – '+(e&&e.message||e));if(my===token)show3d(false)}   /* keep the 2D render */
}
window.addEventListener('shipmodel',apply);
apply();
</script>
<script>
/* ===== EDIT ME ===== */
const CONFIG = {
  // Paste your EVE application Client ID here (from developers.eveonline.com).
  // You can also add ?client_id=XXXX to the URL once; it is then remembered.
  clientId: ''
};
/* No-login option: add ?mode=killboard to show the ship from your latest kill/loss instead (add ?character=ID to pick the pilot). */
/* =================== */

const QS=new URLSearchParams(location.search);
const DEMO=QS.has('demo');
const MODE=(QS.get('mode')||'live').toLowerCase();
const CHAR=parseInt(QS.get('character')||'1376548045',10);
const esi='https://esi.evetech.net/latest';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{const m=Math.max(0,Math.round((Date.now()-new Date(t))/60000));return m<1?'just now':m<60?m+'m ago':m<1440?Math.floor(m/60)+'h ago':Math.floor(m/1440)+'d ago'};

/* scale 560x200 stage to any source size */
const stage=$('stage');
function fit(){const s=Math.min(innerWidth/560,innerHeight/200);stage.style.transform=`translate(${(innerWidth-560*s)/2}px,${(innerHeight-200*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();

/* ---- ESI helpers ---- */
const cache={};
const getJ=async url=>cache[url]||(cache[url]=await (await fetch(url)).json());
async function shipInfo(typeId){
  const t=await getJ(`${esi}/universe/types/${typeId}/`);
  const g=await getJ(`${esi}/universe/groups/${t.group_id}/`);
  return{shipName:t.name,cls:g.name};
}
function message(t,html){const m=$('msg');if(html)m.innerHTML=html;else{m.classList.remove('login');m.textContent=t}m.style.display='flex'}

/* ================= EVE SSO (PKCE, no secret needed) ================= */
const SCOPES='esi-location.read_ship_type.v1';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
if(QS.get('client_id'))lsSet('npsi_cid',QS.get('client_id'));
const CLIENT_ID=(CONFIG.clientId||lsGet('npsi_cid')||'').trim();
const REDIRECT=location.origin+location.pathname;
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rnd=n=>b64url(crypto.getRandomValues(new Uint8Array(n)));

async function login(){
  if(!CLIENT_ID){showLogin('NO CLIENT ID – add ?client_id=YOUR_ID to the URL');return}
  if(!(window.crypto&&crypto.subtle)){showLogin('This page must be opened over https');return}
  const v=rnd(48),state=rnd(16);
  const ch=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  lsSet('npsi_pkce',JSON.stringify({v,s:state}));
  location.href='https://login.eveonline.com/v2/oauth/authorize/?'+new URLSearchParams({
    response_type:'code',redirect_uri:REDIRECT,client_id:CLIENT_ID,scope:SCOPES,
    code_challenge:ch,code_challenge_method:'S256',state});
}
async function tokenReq(params){
  const r=await fetch('https://login.eveonline.com/v2/oauth/token',{method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,...params})});
  if(!r.ok){let b='';try{b=(await r.text()).slice(0,160)}catch(e){}throw new Error('token endpoint '+r.status+' '+b)}
  return r.json();
}
function saveTokens(t){
  const pl=JSON.parse(atob(t.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
  lsSet('npsi_auth',JSON.stringify({access:t.access_token,refresh:t.refresh_token,
    exp:Date.now()+(t.expires_in-60)*1000,id:+pl.sub.split(':')[2],name:pl.name}));
}
async function handleCallback(){
  if(QS.get('error')){history.replaceState(null,'',location.pathname);throw new Error('EVE said: '+QS.get('error')+' – '+(QS.get('error_description')||''))}
  const code=QS.get('code');if(!code)return;
  const saved=JSON.parse(lsGet('npsi_pkce')||'null');
  history.replaceState(null,'',location.pathname);
  if(!saved)throw new Error('login data lost (browser storage unavailable?)');
  if(saved.s!==QS.get('state'))throw new Error('state mismatch');
  saveTokens(await tokenReq({grant_type:'authorization_code',code,code_verifier:saved.v}));
  lsDel('npsi_pkce');
}
async function bearer(){
  let a=JSON.parse(lsGet('npsi_auth')||'null');if(!a)return null;
  if(Date.now()>a.exp){
    try{saveTokens(await tokenReq({grant_type:'refresh_token',refresh_token:a.refresh}));a=JSON.parse(lsGet('npsi_auth'))}
    catch(e){lsDel('npsi_auth');return null}
  }
  return a;
}
const esiAuth=(path,a)=>fetch(esi+path,{headers:{Authorization:'Bearer '+a.access}});

/* ================= ship sources ================= */
/* ships that have a 3D model: ship name -> file (placed next to this page) */
const MODELS={'Raptor':'Raptor_14.glb'};
function setModel(name){window.__wantModel=MODELS[name]||null;window.dispatchEvent(new Event('shipmodel'))}
let curKey=null;
function render(m){
  $('msg').style.display='none';
  if(m.key===curKey)return;curKey=m.key;
  const img=$('ship');img.classList.remove('in');void img.offsetWidth;
  img.src=`https://images.evetech.net/types/${m.ship}/render?size=256`;img.classList.add('in');
  setModel(m.shipName);
  $('sname').textContent=m.shipName;$('scls').textContent=m.cls||'';
  $('cust').textContent=m.custom?'“'+m.custom+'”':'';
  $('pilot').textContent=m.pilot||'';$('labt').textContent=m.label||'NOW FLYING';
  /* replay the entrance animation on every ship change */
  document.querySelectorAll('#info>*').forEach(e=>{e.style.animation='none';void e.offsetWidth;e.style.animation=''});
  const f=$('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
}

async function liveLoad(){
  const a=await bearer();
  if(!a){showLogin();return}
  const r=await esiAuth(`/characters/${a.id}/ship/`,a);
  if(r.status===401||r.status===403){lsDel('npsi_auth');showLogin();return}
  const sh=await r.json();
  const info=await shipInfo(sh.ship_type_id);
  render({key:sh.ship_item_id+':'+sh.ship_type_id,ship:sh.ship_type_id,...info,custom:sh.ship_name,pilot:a.name,label:'NOW FLYING'});
}

/* no-login option: ship from the latest kill/loss on zKillboard */
async function killboardLoad(){
  const list=await (await fetch(`https://zkillboard.com/api/characterID/${CHAR}/`)).json();
  const kms=await Promise.all(list.slice(0,10).map(z=>fetch(`${esi}/killmails/${z.killmail_id}/${z.zkb.hash}/`).then(r=>r.json())));
  kms.sort((a,b)=>new Date(b.killmail_time)-new Date(a.killmail_time));
  if(!kms.length){message('NO RECENT ACTIVITY');return}
  const k=kms[0],ship=k.victim.character_id===CHAR?k.victim.ship_type_id:k.attackers.find(x=>x.character_id===CHAR).ship_type_id;
  const names=await (await fetch(esi+'/universe/names/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify([CHAR])})).json();
  render({key:'kb'+k.killmail_id,ship,...await shipInfo(ship),pilot:names[0].name,label:'LAST SEEN · '+ago(k.killmail_time)});
}

function demoModel(){return QS.get('demo')==='raptor'?{key:'demo',ship:11196,shipName:'Raptor',cls:'Interceptor',custom:'Demo Ship',pilot:'Demo Pilot',label:'NOW FLYING'}:{key:'demo',ship:29990,shipName:'Loki',cls:'Strategic Cruiser',custom:'Demo Ship',pilot:'Demo Pilot',label:'NOW FLYING'}}

function showLogin(err){
  const m=$('msg');m.classList.add('login');
  message('',`<div>${err?'<span class="err">'+esc(err)+'</span>':'CONNECT TO EVE ONLINE'}</div><button id="lb">LOGIN WITH EVE</button>
    <span class="cb">Callback URL to register: ${esc(REDIRECT)}</span>`);
  $('lb').onclick=login;
}

(async()=>{
  if(DEMO){render(demoModel());return}
  const run=async()=>{try{MODE==='killboard'?await killboardLoad():await liveLoad()}catch(e){if(!curKey)message('AWAITING DATA')}};
  if(MODE==='killboard'){run();setInterval(run,120000);return}
  if(!CLIENT_ID){showLogin('NO CLIENT ID – add ?client_id=YOUR_ID to the URL');return}
  try{await handleCallback()}catch(e){showLogin('LOGIN FAILED: '+(e&&e.message||e));return}
  run();setInterval(run,10000);
})();
</script>
</body>
</html>
