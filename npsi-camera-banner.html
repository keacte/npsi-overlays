<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NPSI.ROCKS – Camera + Banner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== OBS: Browser Source, 1920 x 1080. Put your camera source BELOW this layer
         and size it to fill the transparent window (left 30, top 30, 1430 x 1020). ===== */
:root{
  --bg:#050308;--steel:#a65cff;--steel-dim:#4b2a80;--text:#f4eeff;--head:'Oxanium','Eurostile','Segoe UI',sans-serif; --purple:#8a3ffc; --violet:#b98bff; --glow:#a35cff;
  --dim:#2a1747; --white:#f4efff; --orange:#f58a1f;
  --body:'Rajdhani','Segoe UI',sans-serif;
  /* camera window geometry */
  --camL:30px; --camT:30px; --camW:1430px; --camH:1020px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:var(--body);color:var(--white)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;transform-origin:center center;transform:translate(-50%,-50%)}

/* ---------- BLACK BACKDROP WITH TRANSPARENT CAMERA HOLE ---------- */
#hole{position:absolute;left:var(--camL);top:var(--camT);width:var(--camW);height:var(--camH);
  box-shadow:0 0 0 3000px #000;pointer-events:none}
#stage::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(163,92,255,.04) 0 1px,transparent 1px 4px)}

/* ---------- CAMERA FRAME ---------- */
#cam{position:absolute;left:var(--camL);top:var(--camT);width:var(--camW);height:var(--camH);z-index:5;animation:fadeIn 1.2s .3s both}
#cam .win{position:absolute;inset:0;border:2px solid rgba(138,63,252,.55);
  box-shadow:0 0 30px rgba(163,92,255,.35),inset 0 0 120px rgba(5,3,8,.85),inset 0 0 60px rgba(138,63,252,.30);
  animation:haze 5s ease-in-out infinite}
#cam > i{position:absolute;width:64px;height:64px;border:3px solid var(--purple);animation:pulse 2.4s ease-in-out infinite}
#cam > i:nth-of-type(1){left:-9px;top:-9px;border-right:0;border-bottom:0}
#cam > i:nth-of-type(2){right:-9px;top:-9px;border-left:0;border-bottom:0;animation-delay:.6s}
#cam > i:nth-of-type(3){left:-9px;bottom:-9px;border-right:0;border-top:0;animation-delay:1.2s}
#cam > i:nth-of-type(4){right:-9px;bottom:-9px;border-left:0;border-top:0;animation-delay:1.8s}
/* tick marks along the frame edges */
#cam .ticks{position:absolute;pointer-events:none}
#cam .ticks.top{left:120px;right:120px;top:-1px;height:8px;background:repeating-linear-gradient(90deg,var(--steel-dim) 0 2px,transparent 2px 24px)}
#cam .ticks.bot{left:120px;right:120px;bottom:-1px;height:8px;background:repeating-linear-gradient(90deg,var(--steel-dim) 0 2px,transparent 2px 24px)}
/* HUD tags inside the frame */
.tag{position:absolute;display:flex;align-items:center;gap:14px;padding:9px 16px;
  background:rgba(5,3,8,.6);border-left:3px solid var(--purple);
  font:600 17px 'Orbitron';letter-spacing:4px;color:var(--white)}
#live{left:26px;top:24px}
#live .dot{width:12px;height:12px;border-radius:50%;background:var(--orange);box-shadow:0 0 12px var(--orange);animation:blink 1s infinite}
#online{left:26px;bottom:24px;font:700 18px 'Rajdhani';letter-spacing:8px;color:var(--violet)}
#online i{font-style:normal;animation:blink 1.2s steps(2) infinite}

/* ---------- RIGHT PANEL ---------- */
#panel{position:absolute;right:0;top:0;bottom:0;width:430px;padding:46px 34px 24px 44px;z-index:3;
  display:flex;flex-direction:column;align-items:stretch;
  background:#000;border-left:3px solid var(--purple);box-shadow:0 0 18px rgba(163,92,255,.35);
  overflow:hidden;animation:slideInR .9s .15s cubic-bezier(.2,.8,.2,1) both}
#panel::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(163,92,255,.05) 0 1px,transparent 1px 4px)}
#panel::after{content:"";position:absolute;left:0;top:0;height:2px;width:100%;
  background:linear-gradient(90deg,transparent,var(--glow),transparent);animation:sweepX 3.6s ease-in-out infinite}
#panel .sweep{position:absolute;left:0;right:0;height:140px;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(163,92,255,.16),transparent);animation:sweepY 5.5s linear infinite}
#panel .tick{position:absolute;left:3px;top:0;bottom:0;width:10px;
  background:repeating-linear-gradient(180deg,var(--steel-dim) 0 2px,transparent 2px 14px)}
#logo{display:block;margin:30px auto 18px;height:170px;width:auto;animation:bob 4s ease-in-out infinite;
  filter:drop-shadow(0 0 16px rgba(163,92,255,.75))}
#site{position:relative;text-align:center;font:900 40px/1 'Orbitron';letter-spacing:4px;
  text-shadow:0 0 30px var(--glow),0 0 70px rgba(138,63,252,.7);animation:flick 7s infinite}
#site:before,#site:after{content:attr(data-t);position:absolute;left:0;right:0;top:0;opacity:0}
#site:before{color:#ff4fd8;animation:gl1 9s infinite}
#site:after{color:#4fd8ff;animation:gl2 9s infinite}
#motto{margin-top:12px;text-align:center;white-space:nowrap;font:700 17px/1 var(--head);letter-spacing:.06em;color:var(--violet);
  text-shadow:0 0 14px rgba(163,92,255,.55)}
#hdr{margin:38px 0 12px;display:flex;align-items:center;gap:10px;font:600 14px 'Orbitron';letter-spacing:4px;color:var(--violet);position:relative}
#hdr::before,#hdr::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--purple))}
#hdr::after{transform:scaleX(-1)}
#cmds{list-style:none;position:relative}
#cmds li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;margin:6px 0;
  font:700 23px/1.1 var(--head);letter-spacing:.03em;color:var(--text);
  border-left:3px solid var(--steel-dim);background:rgba(5,3,8,.55);transition:all .35s}
#cmds li small{font:600 15px/1.2 'Rajdhani';letter-spacing:.1em;color:#a898c4;text-transform:uppercase;white-space:nowrap}
#cmds li.on{border-left-color:#fff;background:rgba(166,92,255,.28);color:#fff;
  transform:translateX(6px);box-shadow:0 0 18px rgba(163,92,255,.45)}
#partner{display:block;margin:auto auto 6px;width:230px;height:auto;position:relative}


/* ---------- ANIMATIONS ---------- */
@keyframes slideInR{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sweepY{from{top:-140px}to{top:100%}}
@keyframes sweepX{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
@keyframes scanCam{from{top:0}to{top:100%}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes haze{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1;filter:drop-shadow(0 0 6px var(--glow))}}
@keyframes blink{50%{opacity:.15}}
@keyframes flick{0%,95%,100%{opacity:1}96%{opacity:.7}97%{opacity:1}98%{opacity:.8}}
@keyframes gl1{0%,94%,100%{opacity:0}95%{opacity:.8;transform:translate(-4px,1px);clip-path:inset(10% 0 60% 0)}97%{opacity:.8;transform:translate(3px,-1px);clip-path:inset(55% 0 15% 0)}}
@keyframes gl2{0%,94%,100%{opacity:0}96%{opacity:.8;transform:translate(4px,-1px);clip-path:inset(60% 0 10% 0)}98%{opacity:.8;transform:translate(-3px,1px);clip-path:inset(15% 0 55% 0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0.01s!important}}
</style>
</head>
<body>

<div id="hole"></div>

<!-- CAMERA WINDOW (transparent – camera source goes underneath) -->

  <div class="win"></div>
  <div class="ticks top"></div><div class="ticks bot"></div>
  <i></i><i></i><i></i><i></i>
  <div class="tag" id="live"><span class="dot"></span><span>LIVE FEED</span></div>
  <div class="tag" id="online">CAPSULEER ONLINE<i>_</i></div>
</div>

<!-- RIGHT PANEL -->
<div id="panel">

<script>
/* ================= EDIT ME ================= */
const CONFIG = {
  commands: [
    ["!discord","community"],
    ["!npsi","website"],
    ["!funinc","FUN INC NPSI"],
    ["!keacte","FC"],
    ["!zkillkeacte","keacte zkill"],
    ["!zkillfuninc","FUN INC zkill"]
  ],
};
/* ============================================ */

// Responsive 1920x1080 stage scaling
const stageEl = document.getElementById('stage');
function scaleStage(){
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stageEl.style.transform = `translate(-50%, -50%) scale(${s})`;
}
scaleStage();
window.addEventListener('resize', scaleStage);

// Commands: build list, cycle highlight
const ul = document.getElementById('cmds');
CONFIG.commands.forEach(([c,s]) => {
  const li = document.createElement('li');
  li.innerHTML = `${c}<small>${s}</small>`;
  ul.appendChild(li);
});
let ci = 0;
const items = [...ul.children];
function cycle(){ items.forEach((e,i)=>e.classList.toggle('on', i===ci)); ci=(ci+1)%items.length; }
cycle(); setInterval(cycle, 2200);

</script>
