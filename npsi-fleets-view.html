<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NPSI.ROCKS – Upcoming Fleets</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* OBS Browser Source: width 560, height 800 (any size with the same ratio works), transparent background */
:root{--head:'Oxanium','Eurostile','Segoe UI',sans-serif;--purple:#8a3ffc;--violet:#b98bff;--glow:#a35cff;--dim:#2a1747;--white:#f4efff;--red:#ff2b3d;--gold:#ffc83d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:560px;height:800px;transform-origin:0 0;font-family:'Rajdhani','Segoe UI',sans-serif;color:var(--white);display:flex;flex-direction:column;gap:8px}
@keyframes blink{50%{opacity:.15}}
#head{height:128px;flex:none;border:1px solid var(--purple);background:rgba(5,3,8,.7);padding:12px 16px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
#head:before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,transparent,var(--glow),transparent);animation:sweepx 3.6s ease-in-out infinite}
@keyframes sweepx{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
#head .t{display:flex;align-items:center;gap:10px;font:500 15px 'Orbitron';letter-spacing:4px}
#head .t i{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:blink 1.4s steps(2) infinite}
#pg{font:500 13px 'Orbitron';letter-spacing:3px;color:#a898c4;float:right;margin-top:6px}
#head .t span{margin-left:auto;font:500 13px 'Orbitron';letter-spacing:3px;color:#a898c4}
#next small{display:block;font:500 10px 'Orbitron';letter-spacing:3px;color:var(--violet);margin-bottom:6px}
#next b{font:400 34px/1 var(--head);letter-spacing:2px;font-variant-numeric:tabular-nums;text-shadow:0 0 14px var(--glow)}
#next em{font:500 16px 'Rajdhani';font-style:normal;letter-spacing:.12em;color:#a898c4;margin-left:14px;text-transform:uppercase}
#list{flex:1;min-height:0;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(transparent,#000 22px,#000 calc(100% - 22px),transparent)}
#track{display:flex;flex-direction:column;gap:6px;will-change:transform}
.f{flex:none;height:76px;position:relative;display:flex;align-items:center;gap:14px;padding:0 14px 0 4px;background:rgba(5,3,8,.7);border:1px solid var(--dim);border-left:3px solid var(--purple);overflow:hidden;animation:fin .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes fin{from{opacity:0;transform:translateX(-50px)}}
.f.soon{border-left-color:var(--violet);background:linear-gradient(90deg,rgba(185,139,255,.20),rgba(5,3,8,.75) 70%);box-shadow:0 0 16px rgba(163,92,255,.35)}
.f.live{border-left-color:var(--red);background:linear-gradient(90deg,rgba(255,43,61,.16),rgba(5,3,8,.75) 70%);box-shadow:0 0 16px rgba(255,43,61,.25)}
.f .tm{flex:none;width:84px;text-align:center}
.f .tm b{display:block;font:500 22px/1 'Orbitron';letter-spacing:1px;color:var(--violet);font-variant-numeric:tabular-nums}
.f .tm small{display:block;margin-top:6px;font:500 11px 'Orbitron';letter-spacing:2px;color:#8a7bb0;text-transform:uppercase;white-space:nowrap}
.f.soon .tm b{color:#fff}.f.live .tm b{color:var(--red)}
.f .lg{flex:none;width:60px;height:60px;margin-left:5px;display:flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden}
.f .lg img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.f .lg span{width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(138,63,252,.18);font:500 15px 'Orbitron';letter-spacing:1px;color:var(--violet)}
.f.gold .lg span{color:var(--gold)}
.f .tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.f .tx b{font:400 21px/1.1 var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f .tx span{font:500 16px/1.15 'Rajdhani';color:#cbbbe8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f .tx span.d{color:var(--violet);letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.f.over{opacity:.5;border-left-color:#4b2a80}
.f.over .tag{background:#4b2a80;color:#cbbbe8}
.f .tag{position:absolute;right:0;top:0;padding:2px 10px;font:500 10px 'Orbitron';letter-spacing:2px;background:var(--violet);color:#000}
.f.gold{border-color:rgba(255,200,61,.55);border-left-color:var(--gold);background:linear-gradient(90deg,rgba(255,200,61,.20),rgba(5,3,8,.75) 70%);box-shadow:0 0 18px rgba(255,200,61,.28)}
.f.gold .tm b{color:var(--gold)}.f.gold .tx b{color:#ffe08a;text-shadow:0 0 12px rgba(255,200,61,.55)}.f.gold .tx span.d{color:var(--gold)}
.f.gold .tag{background:var(--gold);color:#000}
.f.live .tag{background:var(--red);color:#fff;animation:blink 1.4s steps(2) infinite}
#empty{height:200px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--dim);font:500 18px 'Orbitron';letter-spacing:5px;color:#7a6a9c;text-align:center;line-height:1.8}
#dbg{position:absolute;left:0;bottom:0;width:560px;padding:4px 8px;font:12px/1.3 monospace;color:#b98bff;background:rgba(5,3,8,.92);white-space:pre-wrap;z-index:9}
</style>
</head>
<body>
<div id="stage">
  <div id="head">
    <div class="t"><i></i>UPCOMING FLEETS<span>NPSI.ROCKS</span></div>
    <div id="next"><small>NEXT FLEET IN<span id="pg"></span></small><b id="cd">--:--:--</b><em id="nn"></em></div>
  </div>
  <div id="list"><div id="track"><div id="empty">NO UPCOMING FLEETS</div></div></div>
</div>
<script>
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/560,innerHeight/800);stage.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();

/* ================= CONFIG =================
   Times are EVE time (UTC), ISO format with a trailing Z.
   Fleets are pulled live from the npsi.rocks schedule API (next 7 days), refreshed every 5 minutes.
   Options:  ?debug=1 (shows how each day loaded)  ?speed=22 (scroll speed)  ?delay=5 (seconds before scrolling starts)   ?days=7   ?demo=1   ?src=https://.../fleets.json  (your own JSON, same fields as FLEETS below)
   FLEETS below is only used as a fallback if the live schedule can't be loaded.                        */
const FLEETS=[
  // {name:'T3D Tuesday', host:'Spectre Fleet', fc:'taylor parker', time:'2026-12-01T19:00:00Z', type:'Low/Null sec roaming', doctrine:'T3 Destroyers', staging:'Jita'},
];
const SPEED=Math.min(120,Math.max(5,parseFloat(new URLSearchParams(location.search).get('speed')||'22')));   /* scroll speed, pixels per second */
const API='https://npsi.rocks/events/api/events/',DAYS_AHEAD=Math.min(14,Math.max(1,parseInt(new URLSearchParams(location.search).get('days')||'7',10)));
const FUN=/\bf\.?\s?u\.?\s?n\.?[\s_-]*inc\b/i;                       /* fleets whose host or name matches this are highlighted gold */
let lastLive=0;const LIVE_EVERY=30*60e3,LIVE_MS=3*3600e3, SOON_MS=60*60e3, REFRESH_MS=5*60e3;
/* ========================================== */

const QS=new URLSearchParams(location.search),list=document.getElementById('list');
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'],MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function dayLabel(d){const t=new Date();const k=x=>Date.UTC(x.getUTCFullYear(),x.getUTCMonth(),x.getUTCDate());
  const diff=Math.round((k(d)-k(t))/864e5);return diff===0?'TODAY':diff===1?'TOMORROW':`${DAYS[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`}
let fleets=[];
function upcoming(){const now=Date.now(),today=new Date().toISOString().slice(0,10);
  const all=fleets.map(f=>({...f,t:new Date(f.time).getTime(),e:f.end?new Date(f.end).getTime():NaN})).filter(f=>!isNaN(f.t)).sort((a,b)=>a.t-b.t);
  const over=f=>f.ended||(isNaN(f.e)?f.t+LIVE_MS:f.e)<=now;
  return [...all.filter(f=>!over(f)),                                  /* live + upcoming first */
          ...all.filter(f=>over(f)&&new Date(f.t).toISOString().slice(0,10)===today).map(f=>({...f,over:true}))]}   /* then today's finished fleets */
const track=document.getElementById('track'),ROW=76,GAP=6;
let shown='',first=true,off=0,cycle=0,last=performance.now(),startAt=0;
const DELAY=parseFloat(new URLSearchParams(location.search).get('delay')||'5')*1000;   /* seconds to hold still after the feed loads, before scrolling starts */
const initials=h=>(String(h||'?').replace(/[^A-Za-z0-9 ]/g,' ').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('')||'?').toUpperCase();
function logo(f){
  const fb=`<span>${esc(initials(f.host))}</span>`;
  if(!f.logo&&!f.hostImage)return fb;
  const u=f.logo||(/^https?:/.test(f.hostImage)?f.hostImage:'https://media.npsi.rocks'+(f.hostImage[0]==='/'?'':'/')+f.hostImage);   /* f.logo = copy saved in this repo */
  return `<img alt="" src="${esc(u)}" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML=this.dataset.fb" data-fb="${esc(fb)}">`;
}
function build(up){
  track.innerHTML='';
  if(!up.length){track.innerHTML='<div id="empty">NO UPCOMING FLEETS</div>';cycle=0;return}
  const mk=(f,i,clone)=>{const e=document.createElement('div');e.dataset.t=f.t;if(f.over)e.dataset.over='1';if(FUN.test((f.host||'')+' '+(f.name||'')))e.dataset.fun='1';
    if(first&&!clone)e.style.animationDelay=Math.min(i,8)*.08+'s';else e.style.animation='none';
    const d=new Date(f.t);
    const sub=[f.fc&&('FC '+f.fc),f.staging,f.host].filter(Boolean).join(' · ');
    const det=[f.type,f.doctrine].filter(Boolean).join(' · ');
    e.innerHTML=`<div class="tm"><b>${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}</b><small>${dayLabel(d)}</small></div>
      <div class="lg">${logo(f)}</div>
      <div class="tx"><b>${esc(f.name)}</b>${sub?`<span>${esc(sub)}</span>`:''}${det?`<span class="d">${esc(det)}</span>`:''}</div><div class="tag" hidden></div>`;
    e.className='f';return e};
  up.forEach((f,i)=>track.appendChild(mk(f,i,false)));
  cycle=up.length*(ROW+GAP);
  if(cycle>list.clientHeight+4)up.forEach((f,i)=>track.appendChild(mk(f,i,true)));   /* second copy for a seamless loop */
  else off=0;
  if(first)startAt=performance.now()+DELAY;
  first=false;
}
function render(){
  const up=upcoming(),key=JSON.stringify(up.map(f=>[f.time,f.name,!!f.over]));
  document.getElementById('pg').textContent=up.length?`${up.length} FLEETS`:'';
  if(key!==shown){shown=key;build(up)}
  const now=Date.now();
  track.querySelectorAll('[data-t]').forEach(e=>{const t=+e.dataset.t,tag=e.querySelector('.tag');
    const over=!!e.dataset.over,fun=!!e.dataset.fun,live=!over&&now>=t,soon=!over&&!live&&t-now<SOON_MS;
    e.classList.toggle('gold',fun);e.classList.toggle('live',live);e.classList.toggle('soon',soon);e.classList.toggle('over',over);tag.hidden=!(live||soon||over||fun);tag.textContent=over?'ENDED':live?'LIVE NOW':soon?'STARTING SOON':'FUN INC'});
  const nx=up.find(f=>!f.over&&f.t>now),cd=document.getElementById('cd'),nn=document.getElementById('nn');
  if(nx){let s=Math.max(0,Math.floor((nx.t-now)/1000));const dd=Math.floor(s/86400);s%=86400;
    cd.textContent=(dd?dd+'d ':'')+`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;nn.textContent=nx.name}
  else{cd.textContent=up.some(f=>!f.over)?'IN PROGRESS':'--:--:--';nn.textContent=''}
}
/* slow continuous scroll upwards, looping seamlessly */
function tick(n){const dt=Math.min(.1,(n-last)/1000);last=n;
  if(cycle>0&&track.children.length>1&&startAt&&n>=startAt){off=(off+SPEED*dt)%cycle;track.style.transform=`translateY(${-off}px)`}else track.style.transform='';
  requestAnimationFrame(tick)}
requestAnimationFrame(tick);
const dayCache={},dbgLines=[];
function dbg(m){if(!QS.has('debug'))return;dbgLines.push(m);const e=document.getElementById('dbg')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'dbg'}));e.textContent=dbgLines.slice(-12).join('\n')}
const ROUTES=[u=>u,u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),u=>'https://corsproxy.io/?url='+encodeURIComponent(u)];
async function getDay(d){
  const day=`${pad(d.getUTCDate())}-${pad(d.getUTCMonth()+1)}-${d.getUTCFullYear()}`,url=API+day;
  for(let i=0;i<ROUTES.length;i++){                 /* direct first, then fallbacks if the browser blocks it (CORS) */
    try{const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);
      const r=await fetch(ROUTES[i](url),{cache:'no-store',signal:c.signal});clearTimeout(t);
      const j=await r.json();if(!Array.isArray(j.events))throw new Error('bad reply');
      dayCache[day]=j.events;dbg(`${day} ok via ${i?'proxy'+i:'direct'}: ${j.events.length}`);return j.events}
    catch(e){dbg(`${day} route ${i} failed`)}}
  if(dayCache[day]){dbg(`${day} using cached`);return dayCache[day]}
  return null;
}
async function loadNpsi(){
  const days=Array.from({length:DAYS_AHEAD+1},(_,i)=>new Date(Date.now()+(i-1)*864e5));
  const order=[1,0,...days.map((_,i)=>i).slice(2)];   /* today first */
  const res=new Array(days.length).fill(null),q=[...order];
  await Promise.all(Array.from({length:3},async()=>{while(q.length){const i=q.shift();res[i]=await getDay(days[i])}}));
  if(res.every(r=>r===null))throw new Error('schedule unreachable');
  const seen=new Set(),out=[];
  res.flat().filter(Boolean).forEach(e=>{if(seen.has(e.id))return;seen.add(e.id);
    out.push({name:e.name,host:e.host,fc:e.fc,staging:e.location,time:e.start,end:e.end,ended:!!e.ended,hostImage:e.hostImage||null})});
  return out;
}
async function load(){
  if(QS.has('demo')){const n=Date.now(),h=3600e3;
    fleets=[{name:'Armor Assault Frigates',host:'Shadow Cartel NPSI',fc:'Dietcoke650',time:new Date(n-.5*h).toISOString(),type:'Low/Null sec roaming',doctrine:'Armor Assault Frigates',staging:'Jita'},
      {name:'T3D Tuesday',host:'Spectre Fleet',fc:'taylor parker',time:new Date(n+.6*h).toISOString(),doctrine:'T3 Destroyers',staging:'Jita'},
      {name:'Fun Inc Roam',host:'Fun Inc NPSI',fc:'keacte',time:new Date(n+3*h).toISOString(),type:'Nullsec roam',doctrine:'Cruisers',staging:'Jita'},
      {name:'Wormhole Chain Clear',fc:'keacte',time:new Date(n+5*h).toISOString(),type:'Wormhole',doctrine:'Tengu / Loki',staging:'Thera'},
      {name:'Hecate Hooligans',fc:'Demo FC',time:new Date(n+22*h).toISOString(),type:'Nullsec roam',doctrine:'T3 Destroyers',staging:'Amamake'},
      {name:'Capital Hunt',fc:'Demo FC',time:new Date(n+50*h).toISOString(),type:'Pochven',doctrine:'Cruisers',staging:'Niarja'}];return}
  const src=QS.get('src');
  if(src){try{const r=await fetch(src,{cache:'no-store'});const j=await r.json();fleets=Array.isArray(j)?j:(j.fleets||j.events||[])}catch(e){fleets=FLEETS}return}
  /* 1) fleets.json, refreshed every 30 min by a GitHub Action in the same repo (same site = no CORS problems) */
  try{const r=await fetch('fleets.json?'+Date.now(),{cache:'no-store'});const j=await r.json();
    if(j.updated&&Date.now()-new Date(j.updated)<2*864e5){fleets=j.fleets||[];dbg('fleets.json ok: '+fleets.length+' (updated '+j.updated+')');return}
    dbg('fleets.json missing or stale')}catch(e){dbg('fleets.json not available')}
  /* 2) otherwise pull the schedule live from npsi.rocks */
  if(fleets.length&&Date.now()-lastLive<LIVE_EVERY)return;        /* live fallback calls npsi.rocks at most once every 30 minutes */
  lastLive=Date.now();
  try{fleets=await loadNpsi()}catch(e){if(!fleets.length)fleets=FLEETS}
}
load().then(render);setInterval(()=>load().then(render),REFRESH_MS);
setInterval(render,1000);
</script>
</body>
</html>
