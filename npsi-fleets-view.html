<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NPSI.ROCKS – Upcoming Fleets</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* OBS Browser Source: width 560, height 800 (any size with the same ratio works), transparent background */
:root{--head:'Oxanium','Eurostile','Segoe UI',sans-serif;--purple:#8a3ffc;--violet:#b98bff;--glow:#a35cff;--dim:#2a1747;--white:#f4efff;--red:#ff2b3d;--gold:#ffc83d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:560px;height:800px;transform-origin:0 0;font-family:'Rajdhani','Segoe UI',sans-serif;color:var(--white);display:flex;flex-direction:column;gap:8px}
@keyframes blink{50%{opacity:.15}}
#head{height:128px;flex:none;border:1px solid var(--purple);background:rgba(5,3,8,.7);padding:12px 16px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
#head:before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,transparent,var(--glow),transparent);animation:sweepx 3.6s ease-in-out infinite}
@keyframes sweepx{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
#head .t{display:flex;align-items:center;gap:10px;font:500 15px 'Orbitron';letter-spacing:4px}
#head .t i{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:blink 1.4s steps(2) infinite}
#pg{font:500 13px 'Orbitron';letter-spacing:3px;color:#a898c4;float:right;margin-top:6px}
#head .t span{margin-left:auto;font:500 13px 'Orbitron';letter-spacing:3px;color:#a898c4}
#next small{display:block;font:500 10px 'Orbitron';letter-spacing:3px;color:var(--violet);margin-bottom:6px}
#next b{font:400 34px/1 var(--head);letter-spacing:2px;font-variant-numeric:tabular-nums;text-shadow:0 0 14px var(--glow)}
#next em{font:500 16px 'Rajdhani';font-style:normal;letter-spacing:.12em;color:#a898c4;margin-left:14px;text-transform:uppercase}
#list{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}
.f{flex:none;height:76px;position:relative;display:flex;align-items:center;gap:14px;padding:0 14px 0 4px;background:rgba(5,3,8,.7);border:1px solid var(--dim);border-left:3px solid var(--purple);overflow:hidden;animation:fin .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes fin{from{opacity:0;transform:translateX(-50px)}}
.f.soon{border-left-color:var(--gold);background:linear-gradient(90deg,rgba(255,200,61,.16),rgba(5,3,8,.75) 70%);box-shadow:0 0 16px rgba(255,200,61,.25)}
.f.live{border-left-color:var(--red);background:linear-gradient(90deg,rgba(255,43,61,.16),rgba(5,3,8,.75) 70%);box-shadow:0 0 16px rgba(255,43,61,.25)}
.f .tm{flex:none;width:92px;text-align:center}
.f .tm b{display:block;font:500 22px/1 'Orbitron';letter-spacing:1px;color:var(--violet);font-variant-numeric:tabular-nums}
.f .tm small{display:block;margin-top:6px;font:500 11px 'Orbitron';letter-spacing:2px;color:#8a7bb0;text-transform:uppercase;white-space:nowrap}
.f.soon .tm b{color:var(--gold)}.f.live .tm b{color:var(--red)}
.f .tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.f .tx b{font:400 21px/1.1 var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f .tx span{font:500 16px/1.15 'Rajdhani';color:#cbbbe8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f .tx span.d{color:var(--violet);letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.f .tag{position:absolute;right:0;top:0;padding:2px 10px;font:500 10px 'Orbitron';letter-spacing:2px;background:var(--gold);color:#000}
.f.live .tag{background:var(--red);color:#fff;animation:blink 1.4s steps(2) infinite}
#empty{flex:1;display:flex;align-items:center;justify-content:center;border:1px dashed var(--dim);font:500 18px 'Orbitron';letter-spacing:5px;color:#7a6a9c;text-align:center;line-height:1.8}
</style>
</head>
<body>
<div id="stage">
  <div id="head">
    <div class="t"><i></i>UPCOMING FLEETS<span>NPSI.ROCKS</span></div>
    <div id="next"><small>NEXT FLEET IN<span id="pg"></span></small><b id="cd">--:--:--</b><em id="nn"></em></div>
  </div>
  <div id="list"><div id="empty">NO UPCOMING FLEETS</div></div>
</div>
<script>
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/560,innerHeight/800);stage.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();

/* ================= CONFIG =================
   Times are EVE time (UTC), ISO format with a trailing Z.
   Fleets are pulled live from the npsi.rocks schedule API (next 7 days), refreshed every 5 minutes.
   Options:  ?max=8   ?days=7   ?demo=1   ?src=https://.../fleets.json  (your own JSON, same fields as FLEETS below)
   FLEETS below is only used as a fallback if the live schedule can't be loaded.                        */
const FLEETS=[
  // {name:'T3D Tuesday', host:'Spectre Fleet', fc:'taylor parker', time:'2026-12-01T19:00:00Z', type:'Low/Null sec roaming', doctrine:'T3 Destroyers', staging:'Jita'},
];
const PAGE=Math.min(8,Math.max(1,parseInt(new URLSearchParams(location.search).get('max')||'8',10))),PAGE_MS=10000;   /* rows per page; extra fleets rotate in pages */
const API='https://npsi.rocks/events/api/events/',DAYS_AHEAD=Math.min(14,Math.max(1,parseInt(new URLSearchParams(location.search).get('days')||'7',10)));
const LIVE_MS=3*3600e3, SOON_MS=60*60e3, REFRESH_MS=5*60e3;
/* ========================================== */

const QS=new URLSearchParams(location.search),list=document.getElementById('list');
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'],MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function dayLabel(d){const t=new Date();const k=x=>Date.UTC(x.getUTCFullYear(),x.getUTCMonth(),x.getUTCDate());
  const diff=Math.round((k(d)-k(t))/864e5);return diff===0?'TODAY':diff===1?'TOMORROW':`${DAYS[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`}
let fleets=[];
function upcoming(){const now=Date.now();
  return fleets.map(f=>({...f,t:new Date(f.time).getTime(),e:f.end?new Date(f.end).getTime():NaN})).filter(f=>!isNaN(f.t)&&(isNaN(f.e)?f.t+LIVE_MS:f.e)>now).sort((a,b)=>a.t-b.t)}
let shown='',page=0;setInterval(()=>{page++},PAGE_MS);
function render(){
  const all=upcoming(),pages=Math.max(1,Math.ceil(all.length/PAGE)),cp=page%pages,up=all.slice(cp*PAGE,cp*PAGE+PAGE);
  document.getElementById('pg').textContent=all.length?`${all.length} FLEETS${pages>1?` · ${cp+1}/${pages}`:''}`:'';
  const key=JSON.stringify([cp,up.map(f=>[f.time,f.name])]);
  if(key!==shown){shown=key;
    list.innerHTML=up.length?'':'<div id="empty">NO UPCOMING FLEETS</div>';
    up.forEach((f,i)=>{const e=document.createElement('div');e.dataset.t=f.t;e.style.animationDelay=i*.08+'s';
      const d=new Date(f.t);
      const sub=[f.fc&&('FC '+f.fc),f.staging,f.host].filter(Boolean).join(' · ');
      const det=[f.type,f.doctrine].filter(Boolean).join(' · ');
      e.innerHTML=`<div class="tm"><b>${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}</b><small>${dayLabel(d)}</small></div>
        <div class="tx"><b>${esc(f.name)}</b>${sub?`<span>${esc(sub)}</span>`:''}${det?`<span class="d">${esc(det)}</span>`:''}</div><div class="tag" hidden></div>`;
      list.appendChild(e)})}
  const now=Date.now();
  list.querySelectorAll('.f,[data-t]').forEach(e=>{e.classList.add('f');const t=+e.dataset.t,tag=e.querySelector('.tag');
    const live=now>=t,soon=!live&&t-now<SOON_MS;
    e.classList.toggle('live',live);e.classList.toggle('soon',soon);tag.hidden=!(live||soon);tag.textContent=live?'LIVE NOW':'STARTING SOON'});
  const nx=all.find(f=>f.t>now),cd=document.getElementById('cd'),nn=document.getElementById('nn');
  if(nx){let s=Math.max(0,Math.floor((nx.t-now)/1000));const dd=Math.floor(s/86400);s%=86400;
    cd.textContent=(dd?dd+'d ':'')+`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;nn.textContent=nx.name}
  else{cd.textContent=all.length?'IN PROGRESS':'--:--:--';nn.textContent=''}
}
async function getDay(d){
  const url=API+`${pad(d.getUTCDate())}-${pad(d.getUTCMonth()+1)}-${d.getUTCFullYear()}`;
  try{return (await (await fetch(url,{cache:'no-store'})).json()).events||[]}
  catch(e){                                         /* fallback if the browser blocks the direct request (CORS) */
    return (await (await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url),{cache:'no-store'})).json()).events||[]}
}
async function loadNpsi(){
  const days=Array.from({length:DAYS_AHEAD+1},(_,i)=>new Date(Date.now()+(i-1)*864e5));
  const res=await Promise.all(days.map(d=>getDay(d).catch(()=>null)));
  if(res.every(r=>r===null))throw new Error('schedule unreachable');
  const seen=new Set(),out=[];
  res.flat().filter(Boolean).forEach(e=>{if(e.ended||seen.has(e.id))return;seen.add(e.id);
    out.push({name:e.name,host:e.host,fc:e.fc,staging:e.location,time:e.start,end:e.end})});
  return out;
}
async function load(){
  if(QS.has('demo')){const n=Date.now(),h=3600e3;
    fleets=[{name:'Armor Assault Frigates',host:'Shadow Cartel NPSI',fc:'Dietcoke650',time:new Date(n-.5*h).toISOString(),type:'Low/Null sec roaming',doctrine:'Armor Assault Frigates',staging:'Jita'},
      {name:'T3D Tuesday',host:'Spectre Fleet',fc:'taylor parker',time:new Date(n+.6*h).toISOString(),doctrine:'T3 Destroyers',staging:'Jita'},
      {name:'Wormhole Chain Clear',fc:'keacte',time:new Date(n+5*h).toISOString(),type:'Wormhole',doctrine:'Tengu / Loki',staging:'Thera'},
      {name:'Hecate Hooligans',fc:'Demo FC',time:new Date(n+22*h).toISOString(),type:'Nullsec roam',doctrine:'T3 Destroyers',staging:'Amamake'},
      {name:'Capital Hunt',fc:'Demo FC',time:new Date(n+50*h).toISOString(),type:'Pochven',doctrine:'Cruisers',staging:'Niarja'}];return}
  const src=QS.get('src');
  if(src){try{const r=await fetch(src,{cache:'no-store'});const j=await r.json();fleets=Array.isArray(j)?j:(j.fleets||j.events||[])}catch(e){fleets=FLEETS}return}
  try{fleets=await loadNpsi()}catch(e){if(!fleets.length)fleets=FLEETS}
}
load().then(render);setInterval(()=>load().then(render),REFRESH_MS);
setInterval(render,1000);
</script>
</body>
</html>
