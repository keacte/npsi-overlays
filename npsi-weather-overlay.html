<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NPSI.ROCKS – New Eden Weather Channel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050308;--steel:#a65cff;--steel-dim:#4b2a80;--text:#f4eeff;--head:'Oxanium','Eurostile','Segoe UI',sans-serif; --purple:#8a3ffc; --violet:#b98bff; --glow:#a35cff;
  --dim:#2a1747; --white:#f4efff; --orange:#f58a1f;--red:#ff2b3d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;
  background:transparent;
  font-family:'Rajdhani','Segoe UI',sans-serif;color:var(--white);overflow:hidden}

/* stream paused badge */
.feed{position:absolute;right:40px;top:36px;border:1px solid var(--purple);padding:12px 20px;
  background:rgba(5,3,8,.55);font:600 18px 'Orbitron';letter-spacing:4px;display:flex;gap:18px;justify-content:space-between;align-items:center;z-index:3}
.dot{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.15}}

/* center */
.center{position:absolute;left:0;right:0;top:130px;bottom:150px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.rings{position:absolute;width:760px;height:760px;opacity:.9}
.rings svg{width:100%;height:100%;overflow:visible}
.r1{transform-origin:380px 380px;animation:spin 40s linear infinite}
.r2{transform-origin:380px 380px;animation:spin 25s linear infinite reverse}
.r3{transform-origin:380px 380px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulsering{transform-origin:380px 380px;animation:ping 3.5s ease-out infinite}
@keyframes ping{from{transform:scale(.6);opacity:.8}to{transform:scale(1.25);opacity:0}}
.title{position:relative;font:900 132px/1 'Orbitron';letter-spacing:10px;text-align:center;
  text-shadow:0 0 30px var(--glow),0 0 70px rgba(138,63,252,.7);animation:flick 7s infinite}
.title:before,.title:after{content:attr(data-t);position:absolute;left:0;right:0;top:0;opacity:.0}
.title:before{color:#ff4fd8;animation:gl1 5s infinite}
.title:after{color:#4fd8ff;animation:gl2 5s infinite}
@keyframes gl1{0%,92%,100%{opacity:0}93%{opacity:.8;transform:translate(-6px,2px);clip-path:inset(10% 0 60% 0)}96%{opacity:.8;transform:translate(5px,-2px);clip-path:inset(55% 0 15% 0)}}
@keyframes gl2{0%,92%,100%{opacity:0}94%{opacity:.8;transform:translate(6px,-2px);clip-path:inset(60% 0 10% 0)}97%{opacity:.8;transform:translate(-5px,2px);clip-path:inset(15% 0 55% 0)}}
@keyframes flick{0%,95%,100%{opacity:1}96%{opacity:.7}97%{opacity:1}98%{opacity:.8}}
.sub{margin-top:22px;font:700 32px 'Rajdhani';letter-spacing:14px;color:var(--violet);position:relative}
.sub i{font-style:normal;animation:blink 1.2s steps(2) infinite}
.bar{position:relative;margin-top:34px;width:560px;height:10px;border:1px solid var(--purple);overflow:hidden}
.bar:after{content:"";position:absolute;top:0;bottom:0;width:140px;
  background:linear-gradient(90deg,transparent,var(--glow),transparent);animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{from{left:-140px}to{left:560px}}
.status{position:relative;margin-top:18px;display:flex;gap:46px;font:600 17px 'Orbitron';letter-spacing:4px;color:#9a86c4}
.status b{color:var(--white);font-weight:600}
#count{font:900 54px 'Orbitron';margin-top:20px;letter-spacing:8px;color:var(--orange);text-shadow:0 0 18px rgba(245,138,31,.6);position:relative;display:none}


/* ---------- weather channel ---------- */
.rings{opacity:.55}
.wtitle{position:relative;font:900 76px/1 'Orbitron';letter-spacing:8px;text-align:center;text-shadow:0 0 26px var(--glow),0 0 60px rgba(138,63,252,.7);animation:flick 7s infinite}
.wsub{position:relative;margin-top:14px;font:700 24px 'Rajdhani';letter-spacing:12px;color:var(--violet)}
.wsub i{font-style:normal;animation:blink 1.2s steps(2) infinite}
.panel{position:relative;margin-top:34px;width:1260px;height:360px;border:1px solid var(--purple);background:rgba(5,3,8,.72);overflow:hidden}
.panel:before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,transparent,var(--glow),transparent);animation:sweepx 3.6s ease-in-out infinite}
@keyframes sweepx{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
.fc{position:absolute;inset:0;padding:34px 44px;display:flex;gap:40px;align-items:center;opacity:0;transform:translateX(60px);transition:opacity .7s,transform .7s}
.fc.on{opacity:1;transform:none}
.fc.out{opacity:0;transform:translateX(-60px)}
.fc .ico{flex:none;width:230px;height:230px}
.fc .ico svg{width:100%;height:100%;overflow:visible}
.fc .body{flex:1;min-width:0}
.fc .loc{font:900 64px/1 'Orbitron';letter-spacing:6px;color:var(--white);text-shadow:0 0 22px var(--glow)}
.fc .cond{margin-top:8px;font:600 26px 'Orbitron';letter-spacing:6px;color:var(--violet);text-transform:uppercase}
.fc .txt{margin-top:18px;font:600 36px/1.25 'Rajdhani';letter-spacing:.03em;color:var(--white)}
.chips{display:flex;gap:14px;margin-top:20px}
.chips span{padding:6px 16px;background:rgba(138,63,252,.18);border-left:3px solid var(--purple);font:600 16px 'Orbitron';letter-spacing:3px;color:#a898c4;white-space:nowrap}
.chips b{color:var(--white);font-weight:600;margin-left:8px}
.chips b.bad{color:var(--red)}
.outlook{position:relative;margin-top:16px;width:1260px;display:flex;gap:10px}
.outlook div{flex:1;padding:10px 14px;background:rgba(5,3,8,.6);border-left:3px solid var(--steel-dim);min-width:0}
.outlook small{display:block;font:500 13px 'Orbitron';letter-spacing:3px;color:var(--violet)}
.outlook b{display:block;margin-top:4px;font:600 21px 'Rajdhani';letter-spacing:.06em;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bub{animation:drift 5s ease-in-out infinite}.bub:nth-child(2){animation-delay:-1.4s}.bub:nth-child(3){animation-delay:-2.8s}.bub:nth-child(4){animation-delay:-4s}
@keyframes drift{50%{transform:translateY(-14px)}}
.rain line{animation:fall 1.1s linear infinite}.rain line:nth-child(2n){animation-delay:-.4s}.rain line:nth-child(3n){animation-delay:-.8s}
@keyframes fall{from{transform:translateY(-18px);opacity:0}30%{opacity:1}to{transform:translateY(24px);opacity:0}}
.bolt{animation:flick2 3s infinite}@keyframes flick2{0%,88%,100%{opacity:.25}90%,94%{opacity:1}92%{opacity:.4}}
.sweepr{transform-origin:115px 115px;animation:spin 3s linear infinite}

/* corner brackets */
.br{position:absolute;width:60px;height:60px;border:2px solid var(--purple);animation:blink 3s infinite}
.br.tl{left:30px;top:30px;border-right:0;border-bottom:0}
.br.bl{left:30px;bottom:150px;border-right:0;border-top:0}
.br.tr{right:30px;top:30px;border-left:0;border-bottom:0}
.br.brr{right:30px;bottom:150px;border-left:0;border-top:0}

/* ticker */
.ticker{position:absolute;left:0;right:0;bottom:0;height:52px;background:#000;border-top:1px solid var(--purple);
  display:flex;align-items:center;z-index:4}
.tickwrap{flex:1;height:100%;overflow:hidden;white-space:nowrap;display:flex;align-items:center}
.tickwrap div{display:inline-block;padding-left:100%;font:600 24px 'Rajdhani';letter-spacing:2px;animation:tick 70s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.clock{flex:none;padding:0 28px;font:700 22px 'Orbitron';letter-spacing:3px;color:var(--violet);background:#000;font-variant-numeric:tabular-nums}

/* logo */
#logo{position:absolute;left:50%;top:22px;height:104px;transform:translateX(-50%);z-index:3;
  filter:drop-shadow(0 0 14px rgba(163,92,255,.75));animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-6px)}}

/* command bar */
#cmdbar{position:absolute;left:30px;right:30px;bottom:72px;display:flex;gap:14px;z-index:3}
#cmdbar .c{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:10px 16px;min-width:0;
  background:rgba(5,3,8,.55);border-left:3px solid var(--steel-dim);animation:cin .6s both;transition:all .35s}
#cmdbar .c b{font:700 28px/1.1 var(--head);letter-spacing:.03em;color:var(--text)}
#cmdbar .c small{font:600 15px/1.2 'Rajdhani';letter-spacing:.1em;color:#a898c4;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmdbar .c.on{border-left-color:#fff;background:rgba(166,92,255,.28);box-shadow:0 0 18px rgba(163,92,255,.45);transform:translateY(-4px)}
#cmdbar .c.on b{color:#fff}
@keyframes cin{from{opacity:0;transform:translateY(24px)}}
</style>
</head>

    ['!keacte','FC'], ['!zkillkeacte','keacte zkill'], ['!zkillfuninc','FUN INC zkill']
  ],
  ticker: 'NPSI.ROCKS  //  NEW EDEN WEATHER CHANNEL  //  FORECASTS ARE ACCURATE UNTIL SOMEONE LIGHTS A CYNO  //  NO REFUNDS FOR LOST CRUISERS  //  JOIN THE DISCORD WITH !discord  //  FLY TOGETHER, WIN TOGETHER  //  ',
  seconds: 9,                       // how long each forecast stays on screen
  // icon: bubbles | storm | rain | calm | wh    chips: [label, value, bad?]
  forecasts: [
    {loc:'TAMA',      cond:'Heavy bubbles',          icon:'bubbles', text:'Heavy bubbles expected around Tama. Visibility poor. High probability of losing your expensive cruiser.',
      chips:[['VISIBILITY','POOR',1],['BUBBLES','97%',1],['CRUISER LOSS','HIGH',1]]},
    {loc:'JITA',      cond:'Dense traffic',          icon:'rain',    text:'Dense traffic over Jita 4-4. Local lag likely. Scattered scams in the trade channel, clearing by Tuesday.',
      chips:[['LAG','SEVERE',1],['SCAMS','SCATTERED'],['UNDOCKING','UNWISE',1]]},
    {loc:'THERA',     cond:'Unstable wormholes',     icon:'wh',      text:'Wormhole conditions unstable. Mass limits approaching. Expect sudden collapse just as you are halfway home.',
      chips:[['MASS','CRITICAL',1],['LIFESPAN','< 4 HOURS'],['HOME','CUT OFF',1]]},
    {loc:'AMAMAKE',   cond:'Frigate showers',        icon:'rain',    text:'Frigate showers over Amamake. Scattered tackle, sunny spells of kiting. Bring an umbrella and a spare hull.',
      chips:[['FRIGATES','RAINING'],['KITING','LIKELY'],['SPARE HULL','ESSENTIAL',1]]},
    {loc:'DELVE',     cond:'Blue doughnut',          icon:'calm',    text:'Blue doughnut conditions over Delve. Light drifting, with a strong chance of nothing at all happening.',
      chips:[['EXCITEMENT','NONE'],['DRIFTING','STEADY'],['COFFEE','REQUIRED']]},
    {loc:'PERIMETER', cond:'Gate camp front',        icon:'storm',   text:'A gate camp front is moving in over Perimeter. Smartbombs likely. Do not under any circumstances click Jump.',
      chips:[['SMARTBOMBS','LIKELY',1],['CAMP','24/7'],['POD LOSS','PROBABLE',1]]},
    {loc:'POCHVEN',   cond:'Triglavian storm',       icon:'storm',   text:'Triglavian storm surge over Pochven. Filaments advised. Rapid weather changes and an unlikely escape.',
      chips:[['FILAMENTS','ADVISED'],['EXITS','LIMITED',1],['VIBES','CHAOTIC']]},
    {loc:'HEK',       cond:'Clear skies',            icon:'calm',    text:'Clear skies over Hek. Nobody is coming to rescue you. Probably.',
      chips:[['VISIBILITY','EXCELLENT'],['RESCUE','UNLIKELY',1],['BUBBLES','NONE']]},
    {loc:'RANCER',    cond:'Smartbomb outbreak',     icon:'bubbles', text:'Smartbomb outbreaks over Rancer. Pod rain likely overnight. Wear a clone and remember to dock early.',
      chips:[['PODS','RAINING',1],['CLONE','ADVISED'],['DOCKING','URGENT',1]]},
  ],
  outlook: [
    ['JITA','Scams · Lag'],['AMARR','Haze · Prayers'],['OSMON','Hot drops'],['TAMA','Bubbles · Tears'],['NULLSEC','Doctrine change']
  ],
};
// Optional: add ?seconds=6 to speed up the forecasts
/* =================== */

const bar=document.getElementById('cmdbar');
bar.innerHTML=CONFIG.commands.map((c,i)=>`<div class="c" style="animation-delay:${i*.12}s"><b>${c[0]}</b><small>${c[1]}</small></div>`).join('');
const cs=[...bar.children]; let ci=0;
(function cyc(){cs.forEach((e,i)=>e.classList.toggle('on',i===ci));ci=(ci+1)%cs.length;setTimeout(cyc,2200)})();
document.getElementById('tick').textContent = CONFIG.ticker.repeat(3);

// scale 1920x1080 stage to any window / OBS source size
const stage = document.getElementById('stage');
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform = `translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`;
}
addEventListener('resize',fit); fit();

// UTC clock
const clk = document.getElementById('clock');
setInterval(()=>{ clk.textContent = new Date().toISOString().substr(11,8)+' UTC'; },1000);

// ---- forecasts ----
const ICONS={
  bubbles:`<svg viewBox="0 0 230 230"><g fill="none" stroke="#b98bff" stroke-width="3"><circle class="bub" cx="95" cy="120" r="70" fill="rgba(163,92,255,.12)"/><circle class="bub" cx="165" cy="85" r="38"/><circle class="bub" cx="150" cy="170" r="30"/><circle class="bub" cx="55" cy="50" r="18"/></g><g fill="#fff" opacity=".8"><circle cx="72" cy="95" r="7"/><circle cx="150" cy="70" r="5"/></g></svg>`,
  storm:`<svg viewBox="0 0 230 230"><g fill="rgba(163,92,255,.15)" stroke="#b98bff" stroke-width="3"><path d="M60 140a38 38 0 0 1 8-75 52 52 0 0 1 98 12 32 32 0 0 1-6 63z"/></g><path class="bolt" d="M118 120 L96 168 L118 168 L104 212 L148 152 L124 152 L140 120z" fill="#ff2b3d" stroke="#fff" stroke-width="2"/></svg>`,
  rain:`<svg viewBox="0 0 230 230"><g fill="rgba(163,92,255,.15)" stroke="#b98bff" stroke-width="3"><path d="M60 120a38 38 0 0 1 8-75 52 52 0 0 1 98 12 32 32 0 0 1-6 63z"/></g><g class="rain" stroke="#b98bff" stroke-width="5" stroke-linecap="round"><line x1="75" y1="150" x2="68" y2="172"/><line x1="105" y1="155" x2="98" y2="177"/><line x1="135" y1="150" x2="128" y2="172"/><line x1="165" y1="155" x2="158" y2="177"/><line x1="90" y1="185" x2="83" y2="207"/><line x1="150" y1="188" x2="143" y2="210"/></g></svg>`,
  calm:`<svg viewBox="0 0 230 230"><g fill="none" stroke="#b98bff" stroke-width="3"><circle cx="115" cy="115" r="46" fill="rgba(163,92,255,.18)"/><circle cx="115" cy="115" r="84" stroke-dasharray="4 12"/></g><g stroke="#b98bff" stroke-width="4" stroke-linecap="round"><line x1="115" y1="14" x2="115" y2="34"/><line x1="115" y1="196" x2="115" y2="216"/><line x1="14" y1="115" x2="34" y2="115"/><line x1="196" y1="115" x2="216" y2="115"/></g></svg>`,
  wh:`<svg viewBox="0 0 230 230"><g fill="none" stroke="#b98bff" stroke-width="3"><circle cx="115" cy="115" r="90" stroke-dasharray="6 10"/><circle cx="115" cy="115" r="62"/><circle cx="115" cy="115" r="34" fill="rgba(163,92,255,.3)"/></g><path class="sweepr" d="M115 115 L115 25 A90 90 0 0 1 190 70z" fill="rgba(185,139,255,.4)"/></svg>`
};
const panel=document.getElementById('panel');
panel.innerHTML=CONFIG.forecasts.map(f=>`<div class="fc"><div class="ico">${ICONS[f.icon]||ICONS.calm}</div><div class="body">
  <div class="loc">${f.loc}</div><div class="cond">${f.cond}</div><div class="txt">${f.text}</div>
  <div class="chips">${f.chips.map(c=>`<span>${c[0]}<b class="${c[2]?'bad':''}">${c[1]}</b></span>`).join('')}</div></div></div>`).join('');
document.getElementById('outlook').innerHTML=CONFIG.outlook.map(o=>`<div><small>${o[0]}</small><b>${o[1]}</b></div>`).join('');
const sec=parseFloat(new URLSearchParams(location.search).get('seconds'))||CONFIG.seconds, fcs=[...panel.children];
let fi=-1;
(function nextFc(){
  const prev=fcs[fi]; if(prev){prev.classList.remove('on');prev.classList.add('out')}
  fi=(fi+1)%fcs.length; const cur=fcs[fi]; cur.classList.remove('out'); void cur.offsetWidth; cur.classList.add('on');
  setTimeout(()=>{if(prev)prev.classList.remove('out')},800);
  setTimeout(nextFc,sec*1000);
})();

</script>
</body>
