<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>NPSI.ROCKS – NPSI Shopping Network</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* OBS Browser Source 1920x1080, transparent (same family as the Starting Soon / BRB / Thanks For Watching screens).
   Options: ?scene=starting|brb|ending  ?seconds=15  ?minutes=5 (countdown)  ?loc=delve (lock one story)  ?bg=0 (transparent, no built-in background) */
:root{--bg:#050308;--steel:#a65cff;--steel-dim:#4b2a80;--text:#f4eeff;--head:'Oxanium','Eurostile','Segoe UI',sans-serif;--purple:#8a3ffc;--violet:#b98bff;--glow:#a35cff;--dim:#2a1747;--white:#f4efff;--red:#ff2a2a;--ac:#a65cff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:transparent;font-family:'Rajdhani','Segoe UI',sans-serif;color:var(--white);overflow:hidden}
@keyframes blink{50%{opacity:.15}}
#bgl{position:absolute;inset:0;display:none;background:radial-gradient(ellipse at 50% 55%,#150a2b 0%,#0a0516 55%,#050308 100%)}
body.bg #bgl{display:block}
#stars{position:absolute;inset:0;display:none}body.bg #stars{display:block}
/* view from inside the Sisters of EVE station: space + station hull seen through a viewport, interior frame in front */
#space,#frame,#stn,#dim{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;pointer-events:none}
body.win #stn,body.win #dim{display:block}
body.win:not(.space) #lite{display:block}
#nebbg{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;pointer-events:none;object-fit:cover;filter:brightness(.8)}body.win:not(.space) #nebbg{display:block}
#lite{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;pointer-events:none}
body.win.space #space{display:block}   /* stars, nebula, planet and sun glare: hidden by default, ?space=1 restores them */
body.win:not(.space) #bokeh{display:none}
body:not(.fx) #fx{display:none}   /* drifting particle effects: hidden by default, ?fx=1 restores them */
body.win:not(.space) #bgl{display:block;background:#000}
body.win.frame #frame{display:block}   /* window frame is hidden by default, ?frame=1 brings it back */
body.win #stars{display:none}
#stn{filter:brightness(.62) saturate(.8);animation:stndrift 70s ease-in-out infinite alternate;transform-origin:30% 75%}
#stn img,#stn canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:fill}
#stn canvas{transition:opacity 1.2s}
@keyframes stndrift{from{transform:translate(-14px,6px) scale(1)}to{transform:translate(18px,-8px) scale(1.035)}}
#dim{background:radial-gradient(ellipse 46% 40% at 50% 52%,rgba(6,3,14,.7),rgba(6,3,14,0) 100%)}
#bokeh{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;filter:blur(5px)}
#stage:after{content:'';position:absolute;inset:0;border:0 solid #ff1f2f;box-shadow:inset 0 0 0 rgba(255,31,47,0);pointer-events:none;z-index:9;opacity:0}
body.crit #stage:after{opacity:1;border-width:14px;animation:critflash .9s steps(1) infinite}
@keyframes critflash{0%{border-color:#ff1f2f;box-shadow:inset 0 0 90px rgba(255,31,47,.55)}50%{border-color:rgba(255,31,47,.08);box-shadow:inset 0 0 20px rgba(255,31,47,.1)}}
body.crit #pic .frm,body.crit #qt{animation:critbox .9s steps(1) infinite}
@keyframes critbox{0%{border-color:#ff1f2f;box-shadow:0 0 22px #ff1f2f}50%{border-color:rgba(255,31,47,.15);box-shadow:none}}
body.crit .center #cin .title{animation:crittxt .9s steps(1) infinite}
@keyframes crittxt{0%{text-shadow:0 0 30px #ff1f2f,0 0 8px #ff1f2f}50%{text-shadow:0 0 6px rgba(255,31,47,.3)}}
#fx{position:absolute;inset:0;pointer-events:none;opacity:.85}
/* badge */
.feed{position:absolute;right:40px;top:36px;border:1px solid var(--purple);padding:12px 20px;background:rgba(5,3,8,.55);font:600 18px 'Orbitron';letter-spacing:4px;display:flex;gap:18px;justify-content:space-between;align-items:center;z-index:3}
.dot{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red);animation:blink 1s infinite}
/* page title (top left) */
#ttl{position:absolute;left:40px;top:34px;z-index:3;font:900 30px/1 'Orbitron';letter-spacing:6px;color:#fff;text-shadow:0 0 18px var(--glow)}
#ttl span{color:var(--violet)}#ttl small{display:block;margin-top:8px;font:600 13px 'Orbitron';letter-spacing:3px;color:#a898c4;text-shadow:none}
/* centre */
.center{position:absolute;left:0;right:0;top:230px;bottom:190px;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:2}
.rings{position:absolute;width:760px;height:760px;opacity:.9}
.rings svg{width:100%;height:100%;overflow:visible}
.r1{transform-origin:380px 380px;animation:spin 40s linear infinite}
.r2{transform-origin:380px 380px;animation:spin 25s linear infinite reverse}
.r3{transform-origin:380px 380px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulsering{transform-origin:380px 380px;animation:ping 3.5s ease-out infinite;stroke:var(--ac)}
.acr{stroke:var(--ac);transition:stroke .6s}
@keyframes ping{from{transform:scale(.6);opacity:.8}to{transform:scale(1.25);opacity:0}}
.lab{position:relative;font:700 17px 'Orbitron';letter-spacing:8px;color:var(--ac);display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lab i{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:blink 1.4s steps(2) infinite}
.title{position:relative;font:900 88px/1 'Orbitron';letter-spacing:6px;text-align:center;white-space:nowrap;text-shadow:0 0 30px var(--ac),0 0 70px rgba(138,63,252,.7);animation:flick 7s infinite}
.title:before,.title:after{content:attr(data-t);position:absolute;left:0;right:0;top:0;opacity:0}
.title:before{color:#ff4fd8;animation:gl1 5s infinite}.title:after{color:#4fd8ff;animation:gl2 5s infinite}
@keyframes gl1{0%,92%,100%{opacity:0}93%{opacity:.8;transform:translate(-6px,2px);clip-path:inset(10% 0 60% 0)}96%{opacity:.8;transform:translate(5px,-2px);clip-path:inset(55% 0 15% 0)}}
@keyframes gl2{0%,92%,100%{opacity:0}94%{opacity:.8;transform:translate(6px,-2px);clip-path:inset(60% 0 10% 0)}97%{opacity:.8;transform:translate(-5px,2px);clip-path:inset(15% 0 55% 0)}}
@keyframes flick{0%,95%,100%{opacity:1}96%{opacity:.7}97%{opacity:1}98%{opacity:.8}}
.reg{position:relative;margin-top:14px;font:600 20px 'Orbitron';letter-spacing:6px;color:#a898c4}.reg b{color:var(--ac)}
.sub{margin-top:14px;font:700 28px/1.15 'Rajdhani';letter-spacing:6px;color:var(--violet);position:relative;text-transform:uppercase;text-align:center;max-width:820px}
.sub i{font-style:normal;animation:blink 1.2s steps(2) infinite}
.bar{position:relative;margin-top:26px;width:560px;height:10px;border:1px solid var(--purple);overflow:hidden}
.bar:after{content:"";position:absolute;top:0;bottom:0;width:140px;background:linear-gradient(90deg,transparent,var(--ac),transparent);animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{from{left:-140px}to{left:560px}}
.bar u{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(166,92,255,.35);z-index:1}
#big{position:relative;margin-top:20px;display:flex;align-items:baseline;gap:18px}
#big b{font:900 72px/1 'Orbitron';letter-spacing:4px;color:var(--ac);text-shadow:0 0 22px var(--ac)}
#big span{font:700 18px/1.15 'Orbitron';letter-spacing:4px;color:#cdb4ff;max-width:260px}
.status{position:relative;margin-top:16px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 26px;max-width:820px;font:600 14px 'Orbitron';letter-spacing:2px;color:#9a86c4}
.status b{color:var(--white);font-weight:600}.status b.bad{color:#ff4a5a}
#txt{position:relative;margin-top:14px;max-width:700px;text-align:center;font:500 22px/1.3 'Rajdhani';color:#d9cdf2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#count{position:relative;display:block;margin-top:14px;font:900 54px 'Orbitron';letter-spacing:8px;color:var(--ac);text-shadow:0 0 18px var(--ac)}
#cin.sw>*{animation:swap .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes swap{from{opacity:0;transform:translateY(16px)}}
/* picture (left) */
#pic{position:absolute;left:90px;top:300px;width:420px;z-index:3}
#pic .frm{position:relative;height:330px;border:1px solid var(--ac);background:rgba(6,3,13,.7);overflow:hidden}
#pic .planet{position:absolute;left:50%;top:50%;width:250px;height:250px;margin:-125px 0 0 -125px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--ac),rgba(30,10,60,.9) 70%);opacity:.5}
#pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:flt 7s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(0,0,0,.8))}
@keyframes flt{50%{transform:translateY(-8px) scale(1.03)}}
#pic video.vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:100% 50%}
#pic .hasvid img,#pic .hasvid .planet{display:none}
#pic .frm.nosig{background:#000}#pic .frm.nosig img,#pic .frm.nosig .planet{display:none}
#pic canvas.grain{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:.11;mix-blend-mode:overlay;pointer-events:none;z-index:2}
#pic .gband{position:absolute;left:0;right:0;height:0;backdrop-filter:hue-rotate(35deg) saturate(1.5) brightness(1.12);z-index:2;pointer-events:none;display:none}
#pic .frm.gl .vid,#pic .frm.gl #pimg{filter:drop-shadow(3px 0 0 rgba(255,40,80,.55)) drop-shadow(-3px 0 0 rgba(40,220,255,.55))}
#pic canvas.stat{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#pic .nsg{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:700 22px Orbitron,sans-serif;letter-spacing:.3em;color:#fff;text-shadow:0 0 12px #000,0 0 4px #000;animation:nsb 1.2s steps(2) infinite}@keyframes nsb{50%{opacity:.35}}
#pic img.shot{object-fit:cover;animation:kb 18s ease-in-out infinite alternate;filter:none}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08) translateX(-1.5%)}}
#pic .frm:after{content:'';position:absolute;left:0;right:0;height:60px;top:-60px;background:linear-gradient(180deg,transparent,rgba(166,92,255,.22),transparent);animation:scan 4.5s linear infinite}
@keyframes scan{to{top:100%}}
#pic i{position:absolute;width:20px;height:20px;border:2px solid var(--ac);z-index:2}
#pic i.a{left:6px;top:6px;border-right:0;border-bottom:0}#pic i.b{right:6px;top:6px;border-left:0;border-bottom:0}
#pic i.c{left:6px;bottom:6px;border-right:0;border-top:0}#pic i.d{right:6px;bottom:6px;border-left:0;border-top:0}
#cap{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:linear-gradient(0deg,rgba(5,3,8,.95),transparent);font:600 12px/1.25 'Orbitron';letter-spacing:2px;color:#cdb4ff;z-index:2}
#qt{margin-top:12px;padding:10px 14px;border-left:3px solid var(--ac);background:rgba(5,3,8,.55);font:500 16px/1.25 'Rajdhani';letter-spacing:.04em;color:#bfb0dd}
#qt em{display:block;margin-bottom:3px;font:600 11px 'Orbitron';letter-spacing:3px;color:var(--ac);font-style:normal}
#credit{margin-top:6px;font:500 10px 'Orbitron';letter-spacing:3px;color:#6f5f93;text-align:right}
/* list (right) */
#list{position:absolute;right:90px;top:300px;width:400px;z-index:3;display:flex;flex-direction:column;gap:6px}
#list h3{font:700 13px 'Orbitron';letter-spacing:5px;color:var(--violet);margin-bottom:2px;display:flex;justify-content:space-between}
#list h3 span{color:#6f5f93}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;height:50px;padding:0 14px;border:1px solid var(--dim);border-left:3px solid var(--rc);background:rgba(5,3,8,.6);transition:all .35s}
.row{position:relative;overflow:hidden}.row b,.row em{position:relative;z-index:2}
.row .rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:100% 38%;opacity:.65;z-index:0;transition:opacity .4s}
.row .rs{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(5,3,8,.85),rgba(5,3,8,.15) 70%,rgba(5,3,8,.55))}
.row.on .rv{opacity:1}
.row.on{background:rgba(166,92,255,.26);border-color:var(--rc);box-shadow:0 0 18px rgba(163,92,255,.4);transform:translateX(-6px)}
.row b{font:800 20px/1 'Oxanium';letter-spacing:2px;color:#fff;text-transform:uppercase}
.row em{font:800 15px 'Orbitron';font-style:normal;color:var(--rc);text-shadow:0 0 10px var(--rc);white-space:nowrap}
/* corner brackets */
.br{position:absolute;width:60px;height:60px;border:2px solid var(--purple);animation:blink 3s infinite;z-index:3}
.br.tl{left:30px;top:30px;border-right:0;border-bottom:0}.br.bl{left:30px;bottom:150px;border-right:0;border-top:0}
.br.tr{right:30px;top:30px;border-left:0;border-bottom:0}.br.brr{right:30px;bottom:150px;border-left:0;border-top:0}
/* ticker */
.ticker{position:absolute;left:0;right:0;bottom:0;height:52px;background:#000;border-top:1px solid var(--purple);display:flex;align-items:center;z-index:4}
.ticker .tag{flex:none;height:100%;padding:0 24px;display:flex;align-items:center;background:var(--red);color:#fff;font:900 16px 'Orbitron';letter-spacing:4px}
.tickwrap{flex:1;height:100%;overflow:hidden;white-space:nowrap;display:flex;align-items:center}
.tickwrap div{display:inline-block;font:600 24px 'Rajdhani';letter-spacing:2px;animation:tick 160s linear infinite}
@keyframes tick{to{transform:translateX(-50%)}}
.livetag{flex:none;height:100%;display:flex;align-items:center;gap:12px;padding:0 24px;background:rgba(20,8,40,.95);border-left:1px solid var(--purple);border-right:1px solid var(--purple);font:900 16px 'Orbitron';letter-spacing:4px;color:#fff;white-space:nowrap}
.clock{flex:none;padding:0 28px;font:700 22px 'Orbitron';letter-spacing:3px;color:var(--violet);background:#000;font-variant-numeric:tabular-nums}
/* logo */
#logo{position:absolute;left:50%;top:22px;height:104px;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 0 14px rgba(163,92,255,.75))}
/* outlook bar (replaces the command bar) */
#cmdbar{position:absolute;left:30px;right:30px;bottom:72px;display:flex;gap:14px;z-index:3}
#cmdbar .c{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:10px 16px;min-width:0;background:rgba(5,3,8,.55);border-left:3px solid var(--steel-dim);animation:cin .6s both;transition:all .35s}
#cmdbar .c small{font:700 12px 'Orbitron';letter-spacing:4px;color:var(--violet)}
#cmdbar .c b{font:700 24px/1.1 var(--head);letter-spacing:.03em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmdbar .c p{font:600 15px/1.2 'Rajdhani';letter-spacing:.06em;color:#a898c4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmdbar .c.on{border-left-color:#fff;background:rgba(166,92,255,.28);box-shadow:0 0 18px rgba(163,92,255,.45);transform:translateY(-4px)}
#cmdbar .c.on b{color:#fff}
@keyframes cin{from{opacity:0;transform:translateY(24px)}}
#pic .burst{position:absolute;right:-52px;top:-48px;width:128px;height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#e3182d;color:#fff;font:900 19px 'Orbitron';letter-spacing:0;text-align:center;line-height:1.15;clip-path:polygon(50% 0,60% 12%,75% 6%,78% 22%,94% 25%,88% 40%,100% 50%,88% 60%,94% 75%,78% 78%,75% 94%,60% 88%,50% 100%,40% 88%,25% 94%,22% 78%,6% 75%,12% 60%,0 50%,12% 40%,6% 25%,22% 22%,25% 6%,40% 12%);animation:bpulse 1.1s ease-in-out infinite;z-index:6;filter:drop-shadow(0 0 12px rgba(227,24,45,.8))}
#pic .burst small{font:700 10px 'Orbitron';letter-spacing:2px;margin-top:3px}
@keyframes bpulse{50%{transform:scale(1.1) rotate(5deg)}}
</style></head><body>
