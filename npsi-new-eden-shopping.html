<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>NPSI.ROCKS – NPSI Shopping Network</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* NPSI Shopping Network: a parody home-shopping channel for OBS. Browser Source 1920x1080.
   Options: ?seconds=14 (time per lot)  ?loc=quafe (lock one lot: quafe skins air plate candle worm kit bundle)  ?bg=0 (transparent)  ?sold=0 (hide purchase pop-ups) */
:root{--gold:#ffc83d;--gold2:#ffe9a0;--red:#e3182d;--purple:#8a3ffc;--violet:#b98bff;--ac:#ffc83d;--text:#f4eeff;--head:'Oxanium','Segoe UI',sans-serif}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Rajdhani','Oxanium',sans-serif;color:var(--text)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
#stage>*{position:absolute}
#nebbg,#lite,#vg{left:0;top:0;width:1920px;height:1080px;display:none;pointer-events:none}
body.bg #nebbg,body.bg #lite,body.bg #vg{display:block}
#nebbg{object-fit:cover;filter:brightness(.62)}
#vg{background:radial-gradient(ellipse at 40% 45%,rgba(0,0,0,0) 40%,rgba(2,1,6,.75) 100%)}
#ttl{left:40px;top:26px;font:900 38px 'Orbitron';letter-spacing:6px;color:#fff;text-shadow:0 0 18px rgba(163,92,255,.8)}
#ttl span{color:var(--gold)}#ttl small{display:block;margin-top:4px;font:600 13px 'Orbitron';letter-spacing:5px;color:#a995d6}
#logo{left:50%;top:18px;height:96px;transform:translateX(-50%);filter:drop-shadow(0 0 14px rgba(163,92,255,.75))}
#live{right:40px;top:30px;display:flex;gap:12px;align-items:center}
#live b{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--red);font:900 20px 'Orbitron';letter-spacing:5px;color:#fff;box-shadow:0 0 20px rgba(227,24,45,.7)}
#live b i{width:12px;height:12px;border-radius:50%;background:#fff;animation:bl 1s steps(1) infinite}
#offer{padding:10px 18px;border:2px solid var(--gold);background:rgba(20,8,40,.85);font:900 20px 'Orbitron';letter-spacing:3px;color:var(--gold);white-space:nowrap}
@keyframes bl{50%{opacity:.15}}
/* product stage */
#pstage{left:60px;top:150px;width:1040px;height:660px;border:3px solid var(--ac);background:#0a0518;box-shadow:0 0 40px rgba(163,92,255,.45),inset 0 0 60px rgba(0,0,0,.6);overflow:visible}
#pclip{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 46%,#4a2a8a 0,#1a0c36 55%,#0a0518 100%)}
#rays{position:absolute;left:50%;top:50%;width:1700px;height:1700px;margin:-850px 0 0 -850px;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.085) 0 8deg,rgba(255,255,255,0) 8deg 20deg);animation:spin 80s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 62%);mask-image:radial-gradient(circle,#000 0,transparent 62%)}
@keyframes spin{to{transform:rotate(360deg)}}
#pimg{position:absolute;left:50%;top:50%;width:960px;height:754px;margin:-377px 0 0 -480px;object-fit:contain;animation:flt 5s ease-in-out infinite;filter:drop-shadow(0 20px 30px rgba(0,0,0,.6))}
#pimg.photo{left:0;top:0;width:1040px;height:660px;margin:0;object-fit:cover;animation:none;filter:none}
@keyframes flt{50%{transform:translateY(-12px)}}
#pstage:before,#pstage:after{content:'';position:absolute;width:34px;height:34px;border:4px solid var(--gold);z-index:3}
#pstage:before{left:-8px;top:-8px;border-right:0;border-bottom:0}#pstage:after{right:-8px;bottom:-8px;border-left:0;border-top:0}
#lot{position:absolute;left:0;top:0;padding:8px 18px;background:var(--ac);color:#12081f;font:900 18px 'Orbitron';letter-spacing:4px;z-index:4}
#burst{position:absolute;right:-56px;top:-56px;width:170px;height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--red);color:#fff;font:900 28px 'Orbitron';text-align:center;line-height:1.05;z-index:6;clip-path:polygon(50% 0,60% 12%,75% 6%,78% 22%,94% 25%,88% 40%,100% 50%,88% 60%,94% 75%,78% 78%,75% 94%,60% 88%,50% 100%,40% 88%,25% 94%,22% 78%,6% 75%,12% 60%,0 50%,12% 40%,6% 25%,22% 22%,25% 6%,40% 12%);animation:bp 1.1s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(227,24,45,.8))}
#burst small{font:700 12px 'Orbitron';letter-spacing:2px;margin-top:4px}
@keyframes bp{50%{transform:scale(1.1) rotate(6deg)}}
/* info column */
#info{left:1150px;top:150px;width:720px}
#tsv{display:inline-block;padding:6px 16px;background:var(--gold);color:#12081f;font:900 16px 'Orbitron';letter-spacing:5px}
#pname{margin-top:12px;font:900 50px/1.04 'Orbitron';letter-spacing:1px;color:#fff;text-shadow:0 0 22px rgba(163,92,255,.65)}
#ptag{margin-top:10px;font:600 26px 'Rajdhani';font-style:italic;color:var(--violet);letter-spacing:1px}
#bul{margin:16px 0 0;padding:0;list-style:none}
#bul li{font:700 24px 'Rajdhani';letter-spacing:1px;margin:7px 0;color:#fff;display:flex;gap:12px;align-items:center}
#bul li:before{content:'✔';color:var(--gold);font-weight:900}
#bul li.hot{color:#ff6a77}#bul li.hot:before{color:#ff6a77;content:'!'}
#price{position:absolute;left:1150px;top:540px;width:720px;height:270px;border:3px solid var(--gold);background:linear-gradient(180deg,rgba(40,12,80,.92),rgba(12,5,26,.95));box-shadow:0 0 30px rgba(255,200,61,.3);padding:14px 22px 0;box-sizing:border-box}
#price .now{display:flex;align-items:baseline;gap:16px}
#price .now em{font:900 22px 'Orbitron';font-style:normal;letter-spacing:5px;color:#fff}
#pv{font:900 104px/1 'Orbitron';color:var(--gold);text-shadow:0 0 24px rgba(255,200,61,.55)}
#pu{font:900 28px 'Orbitron';color:var(--gold2);letter-spacing:3px}
#prow{display:flex;gap:28px;margin-top:8px;font:700 22px 'Rajdhani';letter-spacing:2px;color:#cfc2ee}
#prow span b{color:#fff;font-weight:700}#prow .was b{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:3px}#prow .save b{color:#5df2a0}
#sold{position:absolute;left:22px;right:22px;bottom:14px}
#sold .t{display:flex;justify-content:space-between;font:700 18px 'Orbitron';letter-spacing:3px;color:#cfc2ee}
#sold .t i{font-style:normal;color:#ff6a77;animation:bl .8s steps(1) infinite}
#sold .bar{margin-top:6px;height:16px;background:#1b0f33;border:1px solid #5a3a99}
#sold .bar div{height:100%;width:0;background:linear-gradient(90deg,#e3182d,#ffc83d);transition:width 1s linear}
/* lot chips */
#chips{left:60px;top:830px;width:1810px;display:flex;gap:10px}
.chip{flex:1;height:72px;display:flex;align-items:center;gap:10px;padding:0 10px;background:rgba(10,5,24,.85);border:1px solid #3a2570;overflow:hidden;min-width:0}
.chip img{width:60px;height:47px;object-fit:cover;flex:none;border:1px solid #3a2570}
.chip div{min-width:0}.chip b{display:block;font:700 15px 'Orbitron';letter-spacing:1px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip small{font:700 17px 'Rajdhani';color:var(--gold)}
.chip.on{border:2px solid var(--gold);background:rgba(60,30,110,.9);box-shadow:0 0 20px rgba(255,200,61,.4)}
/* lower third */
#lt{left:0;top:920px;width:1920px;height:104px;display:flex;align-items:stretch}
#lt .tag{width:300px;background:var(--red);display:flex;flex-direction:column;justify-content:center;padding-left:36px;font:900 22px 'Orbitron';letter-spacing:4px;color:#fff;clip-path:polygon(0 0,100% 0,calc(100% - 30px) 100%,0 100%)}
#lt .tag small{font:700 13px 'Orbitron';letter-spacing:3px;color:#ffd5d9;margin-top:4px}
#lt .mid{flex:1;background:linear-gradient(90deg,rgba(14,6,30,.96),rgba(30,12,60,.96));border-top:3px solid var(--gold);display:flex;align-items:center;gap:30px;padding:0 30px}
#ltn{font:900 38px 'Orbitron';letter-spacing:2px;color:#fff;white-space:nowrap}
#ltp{margin-left:auto;font:900 52px 'Orbitron';color:var(--gold);white-space:nowrap;text-shadow:0 0 20px rgba(255,200,61,.5)}
#ltp small{font-size:22px;color:var(--gold2);letter-spacing:3px;margin-left:8px}
#lt .call{width:520px;background:var(--gold);color:#12081f;display:flex;flex-direction:column;justify-content:center;align-items:center;clip-path:polygon(30px 0,100% 0,100% 100%,0 100%);font:900 20px 'Orbitron';letter-spacing:3px;animation:cl 1.4s steps(1) infinite}
#lt .call b{font-size:36px;letter-spacing:4px}
@keyframes cl{50%{background:#fff3c4}}
/* ticker */
#tick{left:0;top:1030px;width:1920px;height:50px;display:flex;background:rgba(5,2,12,.96);border-top:1px solid #5a3a99}
#tick .tg{flex:none;width:220px;background:var(--red);display:flex;align-items:center;justify-content:center;font:900 17px 'Orbitron';letter-spacing:4px;color:#fff}
#tw{flex:1;overflow:hidden;position:relative}
#rail{position:absolute;left:0;top:0;height:50px;display:flex;align-items:center;white-space:nowrap;font:900 22px 'Orbitron';letter-spacing:3px;color:#fff;animation:rl 120s linear infinite}
#rail i{display:inline-block;width:14px;height:14px;margin:0 30px;background:var(--gold);transform:rotate(45deg)}
@keyframes rl{to{transform:translateX(-50%)}}
#clk{flex:none;width:240px;display:flex;align-items:center;justify-content:center;font:900 20px 'Orbitron';letter-spacing:3px;color:var(--gold);border-left:1px solid #5a3a99}
/* purchase pop-up */
#toast{left:60px;top:752px;padding:12px 22px 12px 16px;background:rgba(10,5,24,.92);border-left:6px solid #5df2a0;font:700 21px 'Rajdhani';letter-spacing:1px;color:#fff;transform:translateX(-30px);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.3,1),opacity .4s;z-index:9;white-space:nowrap}
#toast b{color:#5df2a0}#toast.on{transform:none;opacity:1}
.swap{animation:sw .5s ease-out}@keyframes sw{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style></head><body>
