<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>NPSI.ROCKS – 10 Points on NPSI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* OBS Browser Source: 1920 x 1080, transparent. Each point shows for 10s (override: ?seconds=15). */
:root{--bg:#050308;--steel:#a65cff;--steel-dim:#4b2a80;--text:#f4eeff;--head:'Oxanium','Eurostile','Segoe UI',sans-serif;--purple:#8a3ffc;--violet:#b98bff;--glow:#a35cff;--dim:#2a1747;--white:#f4efff;--orange:#f58a1f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;font-family:'Rajdhani','Segoe UI',sans-serif;color:var(--white);overflow:hidden}
@keyframes blink{50%{opacity:.15}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:translateX(-50%) translateY(-6px)}}
@keyframes ping{from{transform:scale(.6);opacity:.8}to{transform:scale(1.25);opacity:0}}@keyframes tick{to{transform:translateX(-100%)}}
@keyframes sweepx{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
@keyframes pin{from{opacity:0;transform:translateY(28px)}}@keyframes cin{from{opacity:0;transform:translateX(30px)}}
.feed{position:absolute;right:40px;top:36px;border:1px solid var(--purple);padding:12px 20px;background:rgba(5,3,8,.55);font:600 18px 'Orbitron';letter-spacing:4px;display:flex;gap:18px;align-items:center;z-index:3}
.dot{width:12px;height:12px;border-radius:50%;background:var(--orange);box-shadow:0 0 12px var(--orange);animation:blink 1s infinite}
.rings{position:absolute;left:50%;top:560px;width:900px;height:900px;margin:-450px 0 0 -450px;opacity:.55;z-index:0}
.rings svg{width:100%;height:100%;overflow:visible}
.r1{transform-origin:380px 380px;animation:spin 40s linear infinite}.r2{transform-origin:380px 380px;animation:spin 25s linear infinite reverse}.r3{transform-origin:380px 380px;animation:spin 14s linear infinite}
.pulsering{transform-origin:380px 380px;animation:ping 3.5s ease-out infinite}
.br{position:absolute;width:60px;height:60px;border:2px solid var(--purple);animation:blink 3s infinite}
.br.tl{left:30px;top:30px;border-right:0;border-bottom:0}.br.bl{left:30px;bottom:150px;border-right:0;border-top:0}.br.tr{right:30px;top:30px;border-left:0;border-bottom:0}.br.brr{right:30px;bottom:150px;border-left:0;border-top:0}
#logo{position:absolute;left:50%;top:22px;height:104px;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 0 14px rgba(163,92,255,.75));animation:bob 4s ease-in-out infinite}
#hd{position:absolute;left:0;right:0;top:134px;text-align:center;z-index:3;font:700 20px 'Orbitron';letter-spacing:8px;color:var(--violet)}
#hd b{color:#fff;font-weight:700}
#main{position:absolute;left:110px;right:110px;top:190px;height:640px;z-index:3;border:1px solid var(--purple);border-left:4px solid #fff;background:rgba(5,3,8,.78);overflow:hidden;
  clip-path:polygon(24px 0,100% 0,100% calc(100% - 24px),calc(100% - 24px) 100%,0 100%,0 0)}
#main:before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,transparent,var(--glow),transparent);animation:sweepx 3.6s ease-in-out infinite}
#slide{position:absolute;inset:0;padding:34px 54px 0 54px;display:grid;grid-template-columns:1.05fr 1fr;gap:50px}
#slide>*{animation:pin .6s both}
#num{position:absolute;right:46px;top:8px;font:900 190px/1 'Orbitron';color:rgba(138,63,252,.16);letter-spacing:4px;animation:none;pointer-events:none}
#kick{font:700 18px 'Orbitron';letter-spacing:6px;color:var(--violet);display:flex;gap:12px;align-items:center}
#kick i{width:10px;height:10px;border-radius:50%;background:var(--violet);box-shadow:0 0 10px var(--glow);animation:blink 1.4s steps(2) infinite}
#ttl{font:900 52px/1.08 'Orbitron';letter-spacing:3px;margin:16px 0 10px;text-transform:uppercase;text-shadow:0 0 28px var(--glow),0 0 60px rgba(138,63,252,.6)}
#sub{font:700 28px 'Rajdhani';letter-spacing:5px;color:var(--violet);text-transform:uppercase}
#tl{margin-top:26px;font:600 27px/1.38 'Rajdhani';color:#e5dcf7;border-left:3px solid var(--steel-dim);padding-left:20px}
#tl b{color:#fff}
#pts{display:flex;flex-direction:column;gap:12px;justify-content:center;padding-bottom:30px}
#pts .p{display:flex;gap:18px;align-items:center;padding:12px 20px;background:rgba(166,92,255,.12);border-left:3px solid var(--steel);animation:cin .5s both}
#pts .p em{flex:none;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font:800 16px 'Orbitron';font-style:normal;color:#fff;border:1px solid var(--purple);background:rgba(138,63,252,.4)}
#pts .p b{display:block;font:700 28px/1.15 var(--head);color:#fff}
#pts .p small{display:block;font:600 17px/1.2 'Rajdhani';letter-spacing:.1em;color:#a898c4;text-transform:uppercase}
#prog{position:absolute;left:0;right:0;bottom:0;height:8px;background:rgba(138,63,252,.2)}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--violet));box-shadow:0 0 12px var(--glow)}
#nav{position:absolute;left:110px;right:110px;top:852px;display:grid;grid-template-columns:repeat(10,1fr);gap:10px;z-index:3}
#nav .n{padding:9px 10px;background:rgba(5,3,8,.6);border-left:3px solid var(--steel-dim);transition:all .35s;min-width:0}
#nav .n b{display:block;font:800 17px 'Orbitron';color:var(--steel)}
#nav .n small{display:block;font:600 14px/1.15 'Rajdhani';letter-spacing:.06em;color:#a898c4;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav .n.on{border-left-color:#fff;background:rgba(166,92,255,.3);box-shadow:0 0 18px rgba(163,92,255,.45);transform:translateY(-4px)}
#nav .n.on b,#nav .n.on small{color:#fff}
#cta{position:absolute;left:110px;right:110px;bottom:72px;z-index:3;display:flex;justify-content:center;gap:40px;font:700 26px var(--head);color:#fff}
#cta span{background:rgba(5,3,8,.6);border-left:3px solid var(--steel);padding:8px 22px}#cta small{font:600 15px 'Rajdhani';letter-spacing:.1em;color:#a898c4;margin-left:10px;text-transform:uppercase}
.ticker{position:absolute;left:0;right:0;bottom:0;height:52px;background:#000;border-top:1px solid var(--purple);display:flex;align-items:center;z-index:4}
.tickwrap{flex:1;height:100%;overflow:hidden;white-space:nowrap;display:flex;align-items:center}
.tickwrap div{display:inline-block;padding-left:100%;font:600 24px 'Rajdhani';letter-spacing:2px;animation:tick 70s linear infinite}
.clock{flex:none;padding:0 28px;font:700 22px 'Orbitron';letter-spacing:3px;color:var(--violet);background:#000;font-variant-numeric:tabular-nums}
</style></head><body>

const $=id=>document.getElementById(id);
const stage=$('stage');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();
$('tick').textContent=TICKER.repeat(3);
setInterval(()=>{$('clock').textContent=new Date().toISOString().substr(11,8)+' UTC'},1000);
$('nav').innerHTML=GUIDES.map((g,i)=>`<div class="n"><b>${String(i+1).padStart(2,'0')}</b><small>${g.s}</small></div>`).join('');
const navs=[...$('nav').children];
let idx=0,t0=0;
function show(i){
  idx=i;const g=GUIDES[i];
  $('num').textContent=String(i+1).padStart(2,'0');
  $('kt').textContent='POINT '+String(i+1).padStart(2,'0')+' OF '+GUIDES.length+' // '+g.s;
  $('ttl').textContent=g.t;$('sub').textContent=g.sub;$('tl').innerHTML=g.tl;
  $('pts').innerHTML=g.p.map((p,k)=>`<div class="p" style="animation-delay:${.15+k*.1}s"><em>${String(k+1).padStart(2,'0')}</em><div><b>${p[0]}</b><small>${p[1]}</small></div></div>`).join('');
  document.querySelectorAll('#slide>*').forEach(e=>{if(e.id!=='num'){e.style.animation='none';void e.offsetWidth;e.style.animation=''}});
  navs.forEach((n,k)=>n.classList.toggle('on',k===i));
  t0=performance.now();
}
function loop(now){
  const el=(now-t0)/1000;$('pf').style.width=Math.min(100,el/SEC*100)+'%';
  if(el>=SEC)show((idx+1)%GUIDES.length);
  requestAnimationFrame(loop);
}
show(+QS.get('guide')>0?(+QS.get('guide')-1)%GUIDES.length:0);requestAnimationFrame(loop);
</script></body></html>
