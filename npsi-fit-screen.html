<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NPSI.ROCKS – Current Fit Screen (Live)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* OBS Browser Source: 1920 x 1080, transparent background. Shows the ship you are flying and its fitted modules, live from EVE. */
:root{--bg:#050308;--steel:#a65cff;--steel-dim:#4b2a80;--text:#f4eeff;--head:'Oxanium','Eurostile','Segoe UI',sans-serif;--purple:#8a3ffc;--violet:#b98bff;--glow:#a35cff;--dim:#2a1747;--white:#f4efff;--orange:#f58a1f;
  --c-high:#a65cff;--c-mid:#a65cff;--c-low:#a65cff;--c-rig:#a65cff;--c-sub:#ffffff;--c-cargo:#a65cff;--c-drone:#a65cff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;font-family:'Rajdhani','Segoe UI',sans-serif;color:var(--white);overflow:hidden}
@keyframes blink{50%{opacity:.15}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes ping{from{transform:scale(.6);opacity:.8}to{transform:scale(1.25);opacity:0}}@keyframes tick{to{transform:translateX(-100%)}}
@keyframes sweepx{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
@keyframes shipin{from{opacity:0;transform:translateX(-50px) scale(.7);filter:blur(10px)}}
@keyframes rowin{from{opacity:0;transform:translateX(26px)}}@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.feed{position:absolute;right:40px;top:36px;border:1px solid var(--purple);padding:12px 20px;background:rgba(5,3,8,.55);font:600 18px 'Orbitron';letter-spacing:4px;display:flex;gap:18px;align-items:center;z-index:3}
.dot{width:12px;height:12px;border-radius:50%;background:var(--orange);box-shadow:0 0 12px var(--orange);animation:blink 1s infinite}
.br{position:absolute;width:60px;height:60px;border:2px solid var(--purple);animation:blink 3s infinite}
.br.tl{left:30px;top:30px;border-right:0;border-bottom:0}.br.bl{left:30px;bottom:80px;border-right:0;border-top:0}.br.tr{right:30px;top:30px;border-left:0;border-bottom:0}.br.brr{right:30px;bottom:80px;border-left:0;border-top:0}
#logo{position:absolute;left:50%;top:22px;height:104px;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 0 14px rgba(163,92,255,.75))}
#hd{position:absolute;left:60px;top:48px;z-index:3;font:700 20px 'Orbitron';letter-spacing:8px;color:var(--violet);display:flex;gap:12px;align-items:center}
#hd i{width:10px;height:10px;border-radius:50%;background:#ff2a2a;box-shadow:0 0 10px #ff2a2a;animation:blink 1.4s steps(2) infinite}

/* ship card */
#ship{position:absolute;left:60px;top:130px;width:1800px;height:420px;overflow:visible;z-index:2}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,rgba(185,139,255,.8),transparent 60%);opacity:0;pointer-events:none}
#flash.go{animation:flash .9s ease-out}
#rwrap{position:absolute;left:0;top:0;width:420px;height:420px;display:flex;align-items:center;justify-content:center}
/* ===== HUD around the (static) ship ===== */
#hud{position:absolute;left:0;top:0;width:420px;height:420px;z-index:2;pointer-events:none}
.hl{position:absolute;inset:0;width:100%;height:100%;overflow:visible;will-change:transform,opacity}
.h-cw{transform-origin:50% 50%;animation:spin 40s linear infinite}
.h-ccw{transform-origin:50% 50%;animation:spin 24s linear infinite reverse}
.h-fast{transform-origin:50% 50%;animation:spin 9s linear infinite}
.h-slow{transform-origin:50% 50%;animation:spin 70s linear infinite reverse}
.h-orbit1{transform-origin:50% 50%;animation:spin 7s linear infinite}
.h-orbit2{transform-origin:50% 50%;animation:spin 11s linear infinite reverse}
.h-brk{transform-origin:50% 50%;animation:breathe 3.2s ease-in-out infinite}
.h-ping{transform-origin:50% 50%;animation:ping 3.6s ease-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.07);opacity:.5}}
@keyframes ping{from{transform:scale(.45);opacity:.8}to{transform:scale(1.15);opacity:0}}

#radar{will-change:transform;position:absolute;left:50%;top:50%;width:318px;height:318px;margin:-159px 0 0 -159px;border-radius:50%;z-index:2;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(166,92,255,0) 0deg,rgba(166,92,255,0) 280deg,rgba(185,139,255,.38) 358deg,rgba(255,255,255,.55) 360deg);
  -webkit-mask:radial-gradient(circle,transparent 0 30%,#000 31%);mask:radial-gradient(circle,transparent 0 30%,#000 31%);
  animation:spin 4.5s linear infinite}
#rimg{position:relative;z-index:1;width:322px;height:322px;object-fit:contain;filter:url(#tone) drop-shadow(0 0 14px rgba(163,92,255,.7))}
#rimg.in{animation:shipin .9s cubic-bezier(.2,.8,.2,1) both}
#sinfo{position:absolute;left:470px;width:540px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left}
#lab{display:inline-flex;gap:10px;align-items:center;font:700 16px 'Orbitron';letter-spacing:6px;color:var(--violet)}
#sname{font:800 80px/1.05 var(--head);max-width:540px;text-shadow:0 0 22px rgba(166,92,255,.7);margin-top:6px;white-space:nowrap;overflow-wrap:anywhere}
#scls{font:700 24px 'Orbitron';letter-spacing:5px;color:var(--steel);text-transform:uppercase;margin-top:4px}

/* fit lists */
#fit{position:absolute;left:60px;top:560px;width:1800px;height:440px;z-index:2;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;align-content:start}
.col{height:440px;overflow:hidden;min-width:0}
.col .rows{will-change:transform}
#c6 .vp{height:336px;overflow:hidden}
.col .sc{display:flex;flex-direction:column;gap:14px;will-change:transform}
.sec{background:rgba(5,3,8,.78);border:1px solid var(--dim);border-left:4px solid var(--c);padding:8px 10px 8px;animation:rowin .5s both}
.sec h3{display:flex;justify-content:space-between;font:700 14px 'Orbitron';letter-spacing:4px;color:var(--c);margin-bottom:8px}
.sec h3 span{color:#a898c4;letter-spacing:2px}
.m{display:flex;align-items:center;gap:10px;height:42px;padding:0 2px;border-bottom:1px solid rgba(42,23,71,.8);animation:rowin .45s both}
.m:last-child{border-bottom:0}
.m img{width:32px;height:32px;flex:none;border:1px solid var(--c);background:#0a0514}
.m .t{min-width:0;flex:1}
.m b{display:block;font:700 17px/1.1 var(--head);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m small{display:block;font:600 13px/1.1 'Rajdhani';letter-spacing:.06em;color:var(--violet);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .q{flex:none;font:700 16px 'Orbitron';color:#fff;background:rgba(138,63,252,.4);padding:2px 8px}
.m.e{opacity:.35}.m.e .ph{width:32px;height:32px;flex:none;border:1px dashed var(--c)}
.m.e b{font-weight:600;color:#a898c4}
#c6 .sec{--c:var(--c-cargo)}
#c6 .more{padding:8px 4px;font:700 14px 'Orbitron';letter-spacing:3px;color:#a898c4}
#c6 .m .q{font-size:14px;padding:2px 6px}
#cam{position:absolute;left:1422px;top:105px;width:375px;height:210px;z-index:2;animation:camin .9s cubic-bezier(.2,.8,.2,1) both .2s}
@keyframes camin{from{opacity:0;transform:translateX(50px) scale(.92);filter:blur(8px)}}
#cam .fr{position:absolute;inset:0;border:1px solid rgba(138,63,252,.55);box-shadow:0 0 28px rgba(138,63,252,.25),inset 0 0 40px rgba(138,63,252,.12);overflow:hidden}
#cam .fr:after{content:'';position:absolute;top:0;bottom:0;width:30%;left:0;background:linear-gradient(90deg,transparent,rgba(166,92,255,.16),transparent);animation:sweepx 6s ease-in-out infinite}
#cam i{position:absolute;width:22px;height:22px;border:2px solid #a65cff;filter:drop-shadow(0 0 8px #8a3ffc)}
#cam i.a{left:-6px;top:-6px;border-right:0;border-bottom:0}#cam i.b{right:-6px;top:-6px;border-left:0;border-bottom:0}
#cam i.c{left:-6px;bottom:-6px;border-right:0;border-top:0}#cam i.d{right:-6px;bottom:-6px;border-left:0;border-top:0}
#cam .tag{position:absolute;left:12px;top:10px;display:flex;align-items:center;gap:8px;font:700 11px 'Orbitron';letter-spacing:3px;color:#cdb4ff;text-shadow:0 0 10px rgba(166,92,255,.8)}
#cam .tag u{width:10px;height:10px;border-radius:50%;background:#ff2d3d;box-shadow:0 0 10px #ff2d3d;animation:blink 1.4s infinite}
#cam .cn{position:absolute;right:12px;bottom:8px;font:600 9px 'Orbitron';letter-spacing:3px;color:#7a6a9c}
#note{position:absolute;right:60px;top:1006px;font:600 14px 'Orbitron';letter-spacing:3px;color:#7a6a9c;z-index:3}

/* messages */
#msg{position:absolute;left:60px;right:60px;top:150px;height:850px;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
  background:rgba(5,3,8,.85);border:1px solid var(--purple);font:600 24px 'Orbitron';letter-spacing:6px;color:#7a6a9c;text-align:center}
#msg.login{}
#msg .err{display:block;font:600 22px/1.3 'Rajdhani';letter-spacing:.04em;color:var(--orange);max-width:900px;text-transform:none}
#msg .cb{font:600 16px/1.3 'Rajdhani';letter-spacing:.05em;color:#7a6a9c;text-transform:none;word-break:break-all;max-width:1000px}
#lb{font:700 20px 'Orbitron';letter-spacing:4px;color:#fff;background:var(--purple);border:1px solid var(--violet);padding:14px 28px;cursor:pointer;box-shadow:0 0 18px rgba(163,92,255,.5)}

.ticker{position:absolute;left:0;right:0;bottom:0;height:52px;background:#000;border-top:1px solid var(--purple);display:flex;align-items:center;z-index:4}
.tickwrap{flex:1;height:100%;overflow:hidden;white-space:nowrap;display:flex;align-items:center}
.tickwrap div{display:inline-block;padding-left:100%;font:600 24px 'Rajdhani';letter-spacing:2px;animation:tick 70s linear infinite}
.clock{flex:none;padding:0 28px;font:700 22px 'Orbitron';letter-spacing:3px;color:var(--violet);background:#000;font-variant-numeric:tabular-nums}
</style>
</head>

      <svg class="hl h-slow" viewBox="0 0 200 200" fill="none" stroke="#8a3ffc"><circle cx="100" cy="100" r="97" stroke-width="3" stroke-dasharray="1.2 7.6" stroke="#b98bff" opacity=".8"/></svg>
      <svg class="hl h-cw" viewBox="0 0 200 200" fill="none" stroke="#8a3ffc"><circle cx="100" cy="100" r="94" stroke-width="1.5" stroke-dasharray="3 9" opacity=".7"/><circle cx="100" cy="100" r="91" stroke-width="4" stroke-dasharray="62 220" stroke="#b98bff"/></svg>
      <svg class="hl h-ccw" viewBox="0 0 200 200" fill="none" stroke="#8a3ffc"><circle cx="100" cy="100" r="82" stroke-width="2" stroke-dasharray="28 12 4 12" opacity=".8"/><circle cx="100" cy="100" r="79" stroke-width="5" stroke-dasharray="40 250" stroke="#a35cff"/></svg>
      <svg class="hl h-fast" viewBox="0 0 200 200" fill="none" stroke="#8a3ffc"><circle cx="100" cy="100" r="68" stroke-width="1" stroke-dasharray="2 5" opacity=".6"/></svg>
      <svg class="hl h-ping" viewBox="0 0 200 200" fill="none" stroke="#8a3ffc"><circle cx="100" cy="100" r="85" stroke-width="2" stroke="#b98bff"/></svg>
      <svg class="hl h-orbit1" viewBox="0 0 200 200" fill="none" stroke="#8a3ffc"><circle cx="100" cy="3" r="3" fill="#fff" stroke="none"/><circle cx="100" cy="3" r="7" stroke-width="1" stroke="#b98bff" opacity=".7"/></svg>
      <svg class="hl h-orbit2" viewBox="0 0 200 200" fill="none" stroke="#8a3ffc"><circle cx="197" cy="100" r="2.5" fill="#f58a1f" stroke="none"/></svg>
      <svg class="hl h-brk" viewBox="0 0 200 200" fill="none" stroke="#b98bff" stroke-width="2" stroke-linecap="square"><path d="M44 62V44H62"/><path d="M138 44H156V62"/><path d="M156 138V156H138"/><path d="M62 156H44V138"/></svg>
      <svg class="hl hs" viewBox="0 0 200 200" fill="none" stroke="#8a3ffc"><path d="M100 8v10M100 182v10M8 100h10M182 100h10" stroke="#b98bff" stroke-width="1.5" opacity=".6"/></svg>
      </div>
      <div id="radar"></div>
      <img id="rimg" alt="" onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'">
    </div>
    <div id="cam"><div class="fr"></div><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><div class="tag"><u></u>LIVE CAM</div><div class="cn">NPSI.ROCKS</div></div>
  <div id="sinfo">
      <div id="lab"><i style="width:9px;height:9px;border-radius:50%;background:var(--violet);box-shadow:0 0 10px var(--glow);animation:blink 1.4s steps(2) infinite"></i><span id="labt">NOW FLYING</span></div>
      <div id="sname">—</div><div id="scls"></div>
    </div>
  </div>

  <div id="fit"><div class="col" id="c1"></div><div class="col" id="c2"></div><div class="col" id="c3"></div><div class="col" id="c4"></div><div class="col" id="c5"></div><div class="col" id="c6"></div></div>
  <div id="note"></div>
  <div id="msg">LOADING…</div>

  <div class="ticker"><div class="tickwrap"><div id="tick"></div></div><div class="clock" id="clock">00:00:00 UTC</div></div>
</div>
<script>
/* ===== EDIT ME ===== */
const CONFIG = {
  // Paste your EVE application Client ID here (developers.eveonline.com). Or add ?client_id=XXXX to the URL once; it is then remembered.
  clientId: ''
};
const SHOW_EMPTY = true;      // show empty slots as dim placeholders (?empty=0 hides them)
const TICKER = 'NPSI.ROCKS  //  FLY TOGETHER, WIN TOGETHER  //  NOT PURPLE? SHOOT IT!  //  NO BLUES, NO STRINGS, JUST CONTENT  //  JOIN THE DISCORD WITH !discord  //  ';
/* =================== */

const QS=new URLSearchParams(location.search);
const DEMO=QS.has('demo');
const EMPTY_OK=QS.get('empty')==='0'?false:SHOW_EMPTY;
const esi='https://esi.evetech.net/latest';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stage=$('stage');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();
$('tick').textContent=TICKER.repeat(3);
setInterval(()=>{$('clock').textContent=new Date().toISOString().substr(11,8)+' UTC'},1000);

/* ---- ESI helpers ---- */
const types={},groups={};
async function getType(id){if(types[id])return types[id];const r=await fetch(`${esi}/universe/types/${id}/`);return types[id]=await r.json()}
async function getGroup(id){if(groups[id])return groups[id];const r=await fetch(`${esi}/universe/groups/${id}/`);return groups[id]=await r.json()}
const BASE={high:27,mid:19,low:11,rig:92,sub:125};
const SLOT=f=>f===5?'cargo':f>=27&&f<=34?'high':f>=19&&f<=26?'mid':f>=11&&f<=18?'low':f>=92&&f<=94?'rig':f>=125&&f<=132?'sub':f===87?'drone':null;
function slotCounts(shipId){
  const at={};((types[shipId]||{}).dogma_attributes||[]).forEach(a=>at[a.attribute_id]=a.value);
  return{high:at[14]|0,mid:at[13]|0,low:at[12]|0,rig:at[1137]|0,sub:at[1367]|0};
}
const EMPTY=()=>({high:[],mid:[],low:[],rig:[],sub:[],drone:[],cargo:[]});
async function slotsFromItems(items){
  await Promise.all([...new Set(items.map(i=>i.item_type_id))].map(getType));
  const by={};
  const cg={};
  items.forEach(i=>{const s=SLOT(i.flag);if(s==='cargo')cg[i.item_type_id]=(cg[i.item_type_id]||0)+(i.quantity||1);else if(s)(by[i.flag]??=[]).push(i)});
  const out=EMPTY();
  out.cargo=Object.entries(cg).map(([id,q])=>({id:+id,name:types[id].name,qty:q})).sort((a,b)=>a.name.localeCompare(b.name));
  Object.keys(by).sort((a,b)=>a-b).forEach(f=>{
    const list=by[f],slot=SLOT(+f);
    const mod=list.find(i=>types[i.item_type_id].category_id!==8)||list[0];
    const ch=list.find(i=>types[i.item_type_id].category_id===8&&i!==mod);
    out[slot].push({id:mod.item_type_id,name:types[mod.item_type_id].name,idx:slot==='drone'?out.drone.length:(+f-BASE[slot]),
      charge:ch?types[ch.item_type_id].name:'',qty:slot==='drone'?(mod.quantity||0):0});
  });
  return out;
}
function message(t,html){const m=$('msg');if(html){m.innerHTML=html}else{m.classList.remove('login');m.textContent=t}m.style.display='flex'}

/* ================= EVE SSO (PKCE, no secret needed) ================= */
const SCOPES='esi-location.read_ship_type.v1 esi-assets.read_assets.v1';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
if(QS.get('client_id'))lsSet('npsi_cid',QS.get('client_id'));
const CLIENT_ID=(CONFIG.clientId||lsGet('npsi_cid')||'').trim();
const REDIRECT=location.origin+location.pathname;
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rnd=n=>b64url(crypto.getRandomValues(new Uint8Array(n)));
async function login(){
  if(!CLIENT_ID){showLogin('NO CLIENT ID – add ?client_id=YOUR_ID to the URL');return}
  if(!(window.crypto&&crypto.subtle)){showLogin('This page must be opened over https');return}
  const v=rnd(48),state=rnd(16);
  const ch=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  lsSet('npsi_pkce',JSON.stringify({v,s:state}));
  location.href='https://login.eveonline.com/v2/oauth/authorize/?'+new URLSearchParams({response_type:'code',redirect_uri:REDIRECT,client_id:CLIENT_ID,scope:SCOPES,code_challenge:ch,code_challenge_method:'S256',state});
}
async function tokenReq(params){
  const r=await fetch('https://login.eveonline.com/v2/oauth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,...params})});
  if(!r.ok){let b='';try{b=(await r.text()).slice(0,160)}catch(e){}throw new Error('token endpoint '+r.status+' '+b)}
  return r.json();
}
function saveTokens(t){
  const pl=JSON.parse(atob(t.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
  lsSet('npsi_auth',JSON.stringify({access:t.access_token,refresh:t.refresh_token,exp:Date.now()+(t.expires_in-60)*1000,id:+pl.sub.split(':')[2],name:pl.name,scope:SCOPES}));
}
async function handleCallback(){
  if(QS.get('error')){history.replaceState(null,'',location.pathname);throw new Error('EVE said: '+QS.get('error')+' – '+(QS.get('error_description')||''))}
  const code=QS.get('code');if(!code)return;
  const saved=JSON.parse(lsGet('npsi_pkce')||'null');
  history.replaceState(null,'',location.pathname);
  if(!saved)throw new Error('login data lost (browser storage unavailable?)');
  if(saved.s!==QS.get('state'))throw new Error('state mismatch');
  saveTokens(await tokenReq({grant_type:'authorization_code',code,code_verifier:saved.v}));
  lsDel('npsi_pkce');
}
async function bearer(){
  let a=JSON.parse(lsGet('npsi_auth')||'null');if(!a)return null;
  if(Date.now()>a.exp){
    try{saveTokens(await tokenReq({grant_type:'refresh_token',refresh_token:a.refresh}));a=JSON.parse(lsGet('npsi_auth'))}
    catch(e){lsDel('npsi_auth');return null}
  }
  return a;
}
const esiAuth=(path,a)=>fetch(esi+path,{headers:{Authorization:'Bearer '+a.access}});

/* ================= live ship + fit (ship from /ship/, modules from /assets/) ================= */
const FLAGMAP=f=>{let m;
  if(f==='DroneBay')return 87;
  if(f==='Cargo')return 5;
  if(m=f.match(/^HiSlot(\d)$/))return 27+ +m[1];
  if(m=f.match(/^MedSlot(\d)$/))return 19+ +m[1];
  if(m=f.match(/^LoSlot(\d)$/))return 11+ +m[1];
  if(m=f.match(/^RigSlot(\d)$/))return 92+ +m[1];
  if(m=f.match(/^SubSystemSlot(\d)$/))return 125+ +m[1];
  return null};
async function slotsFromAssets(a,shipItemId){
  const first=await esiAuth(`/characters/${a.id}/assets/?page=1`,a);
  if(first.status===403||first.status===401)throw new Error('scope');
  const pages=+first.headers.get('x-pages')||1;
  let all=await first.json();
  const rest=await Promise.all(Array.from({length:pages-1},(_,i)=>esiAuth(`/characters/${a.id}/assets/?page=${i+2}`,a).then(r=>r.json())));
  rest.forEach(r=>all=all.concat(r));
  const items=all.filter(i=>i.location_id===shipItemId).map(i=>({item_type_id:i.type_id,flag:FLAGMAP(i.location_flag),quantity:i.quantity})).filter(i=>i.flag!==null);
  return slotsFromItems(items);
}
let lastShip=null,lastAssets=0,fitCache=EMPTY();
async function liveLoad(){
  const a=await bearer();
  if(!a){showLogin();return}
  const r=await esiAuth(`/characters/${a.id}/ship/`,a);
  if(r.status===401||r.status===403){lsDel('npsi_auth');showLogin();return}
  const sh=await r.json();
  const key=sh.ship_item_id+':'+sh.ship_type_id;
  if(key!==lastShip||Date.now()-lastAssets>300000){
    try{fitCache=await slotsFromAssets(a,sh.ship_item_id)}
    catch(e){if(e.message==='scope'){lsDel('npsi_auth');showLogin('Login again to allow reading your ship fitting (assets scope)');return}fitCache=EMPTY()}
    lastShip=key;lastAssets=Date.now();
  }
  const t=await getType(sh.ship_type_id);
  const g=await getGroup(t.group_id);
  const sig=Object.values(fitCache).flat().map(x=>x.id+(x.charge||'')+x.qty).join(',');
  render({key:key+'|'+sig,ship:sh.ship_type_id,shipName:t.name,cls:g.name,counts:slotCounts(sh.ship_type_id),slots:fitCache});
}
function demoModel(){
  const m=(id,name,idx,charge='',qty=0)=>({id,name,idx,charge,qty});
  const M={key:'demo',ship:29990,shipName:'Loki',cls:'Strategic Cruiser',counts:{high:5,mid:5,low:5,rig:3,sub:5},slots:{
    high:[m(2929,'Heavy Missile Launcher II',0,'Scourge Rage Heavy Missile'),m(2929,'Heavy Missile Launcher II',1,'Scourge Rage Heavy Missile'),m(2929,'Heavy Missile Launcher II',2,'Scourge Rage Heavy Missile'),m(2929,'Heavy Missile Launcher II',3,'Scourge Rage Heavy Missile')],
    mid:[m(447,'Warp Scrambler II',0),m(448,'Stasis Webifier II',1),m(2281,'Medium Shield Extender II',2),m(2281,'Medium Shield Extender II',3),m(2024,'Sensor Booster II',4,'Targeting Range Script')],
    low:[m(519,'Gyrostabilizer II',0),m(519,'Gyrostabilizer II',1),m(519,'Gyrostabilizer II',2),m(2048,'Damage Control II',3)],
    rig:[m(26436,'Medium Core Defense Field Extender I',0),m(26436,'Medium Core Defense Field Extender I',1)],
    sub:[m(45609,'Loki Defensive - Covert Reconfiguration',0),m(45610,'Loki Electronics - Immobility Drivers',1),m(45611,'Loki Offensive - Launcher Efficiency Configuration',2),m(45612,'Loki Propulsion - Intercalated Nanofibers',3),m(45613,'Loki Core - Dissolution Sequencer',4)],
    drone:[m(2488,'Warrior II',0,'',5),m(2488,'Hobgoblin II',1,'',3)],
    cargo:[['Scourge Rage Heavy Missile',2400],['Nanite Repair Paste',100],['Synth Blue Pill Booster',5],['Warrior II',5],['Sensor Booster II',1],['Scourge Fury Heavy Missile',1200],['Cap Booster 400',20],['Hornet EC-300',2]].map((x,i)=>({id:2488+i,name:x[0],qty:x[1]}))}};
  {const n=+new URLSearchParams(location.search).get('cargo')||0;for(let i=8;i<n;i++)M.slots.cargo.push({id:2488,name:'Demo Item '+(i+1),qty:i+1})}
  return M;
}

/* ship name: one line at full size; if too long, shrink and wrap onto two lines (shrinks further only if two lines still overflow) */
function fitName(){
  const el=$('sname');
  el.style.whiteSpace='nowrap';el.style.fontSize='80px';el.style.lineHeight='1.05';
  if(el.scrollWidth<=el.clientWidth)return;
  el.style.whiteSpace='normal';
  for(let fs=64;fs>=30;fs-=2){
    el.style.fontSize=fs+'px';
    const lines=Math.round(el.scrollHeight/(fs*1.05));
    if(lines<=2&&el.scrollWidth<=el.clientWidth)return;
  }
}
/* ---- gentle auto-scroll for columns whose content overflows: wait 10s, scroll at 50px/s, hold 10s, scroll back ---- */
const SC_WAIT=10000,SC_SPEED=50;let scs=[];
function setupScroll(){
  scs=[...document.querySelectorAll('#c1,#c2,#c3,#c4,#c5,#c6')].map(c=>{const vp=c.querySelector('.vp');return{sc:c.querySelector(vp?'.rows':'.sc'),c:vp||c,y:0,ph:0,t:performance.now()}}).filter(s=>s.sc);
  scs.forEach(s=>{s.sc.style.transform='';s.max=Math.max(0,Math.ceil(s.sc.offsetHeight-s.c.clientHeight)+6)});
}
function scTick(now){
  scs.forEach(s=>{
    if(s.max<=6)return;
    const dt=now-s.t;
    if(s.ph===0||s.ph===2){if(dt>=SC_WAIT){s.ph++;s.t=now}}
    else{const y=Math.min(dt/1000*SC_SPEED,s.max);s.y=s.ph===1?y:s.max-y;s.sc.style.transform=`translateY(${-s.y}px)`;
      if(y>=s.max){s.ph=(s.ph+1)%4;s.t=now}}
  });
  requestAnimationFrame(scTick);
}
requestAnimationFrame(scTick);
/* ---- render ---- */
const SECS=[['high','HIGH SLOTS'],['mid','MID SLOTS'],['low','LOW SLOTS'],['rig','RIGS'],['sub','SUBSYSTEMS'],['drone','DRONE BAY']];
let curKey=null,order=0;
function secHTML(kind,title,m){
  const fitted=m.slots[kind]||[];
  const n=kind==='drone'?fitted.length:Math.max((m.counts||{})[kind]||0,fitted.reduce((x,y)=>Math.max(x,y.idx+1),0));
  if(!n&&!fitted.length)return'';
  const by={};fitted.forEach(x=>by[x.idx]=x);
  let rows='',count=0;
  for(let i=0;i<n;i++){
    const f=by[i];
    const d=(order++*.035).toFixed(3);
    if(f){count++;rows+=`<div class="m" style="animation-delay:${d}s"><img alt="" src="https://images.evetech.net/types/${f.id}/icon?size=64" onerror="this.onerror=null;this.style.opacity=0"><div class="t"><b>${esc(f.name)}</b>${f.charge?`<small>${esc(f.charge)}</small>`:''}</div>${f.qty?`<span class="q">x${f.qty}</span>`:''}</div>`}
    else if(EMPTY_OK&&kind!=='drone')rows+=`<div class="m e" style="animation-delay:${d}s"><span class="ph"></span><div class="t"><b>Empty slot</b></div></div>`;
  }
  if(!rows)return'';
  return`<div class="sec" style="--c:var(--c-${kind})"><h3>${title}<span>${kind==='drone'?count+' TYPES':count+' / '+n}</span></h3>${rows}</div>`;
}
function render(m){
  $('msg').style.display='none';
  if(m.key===curKey)return;curKey=m.key;order=0;
  $('sname').textContent=m.shipName;$('scls').textContent=m.cls||'';fitName();
  const img=$('rimg');img.classList.remove('in');void img.offsetWidth;
  img.src=`https://images.evetech.net/types/${m.ship}/render?size=512`;img.classList.add('in');
  const f=$('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  const h=Object.fromEntries(SECS.map(([k,t])=>[k,secHTML(k,t,m)]));
  $('c1').innerHTML=h.high;$('c2').innerHTML=h.mid;$('c3').innerHTML=h.low;$('c4').innerHTML=h.rig+h.sub;$('c5').innerHTML=h.drone;
  const cg=(m.slots.cargo||[]),shown=cg;
  $('c6').innerHTML=`<div class="sec"><h3>CARGO HOLD<span>${cg.length} ITEM${cg.length===1?'':'S'}</span></h3>`+
    (cg.length?`<div class="vp"><div class="rows">${shown.map((x,i)=>`<div class="m" style="animation-delay:${(i*.03).toFixed(2)}s"><img alt="" src="https://images.evetech.net/types/${x.id}/icon?size=64" onerror="this.onerror=null;this.style.opacity=0"><div class="t"><b>${esc(x.name)}</b></div><span class="q">${x.qty>=1e4?Math.round(x.qty/1e3)+'k':x.qty.toLocaleString('en-GB')}</span></div>`).join('')}</div></div>`:`<div class="more">EMPTY</div>`)+'</div>';
  document.querySelectorAll('#c1,#c2,#c3,#c4,#c5').forEach(c=>{const w=document.createElement('div');w.className='sc';while(c.firstChild)w.appendChild(c.firstChild);c.appendChild(w)});
  /* shrink long module / ammo names to fit their row (single line, min size) so 9 modules per column always fit */
  document.querySelectorAll('.m b,.m small').forEach(el=>{let fs=parseFloat(getComputedStyle(el).fontSize);const min=el.tagName==='B'?12:10;
    while(el.scrollWidth>el.clientWidth&&fs>min){fs-=.5;el.style.fontSize=fs+'px'}});
  setupScroll();
  const any=Object.values(m.slots).some(a=>a.length);
  $('note').textContent=any?'FIT UPDATES WITHIN A FEW MINUTES OF CHANGES':'NO FIT DATA RETURNED BY EVE';
}
function showLogin(err){
  const m=$('msg');m.classList.add('login');
  message('',`<div>${err?'<span class="err">'+esc(err)+'</span>':'CONNECT TO EVE ONLINE'}</div><button id="lb">LOGIN WITH EVE</button><span class="cb">Callback URL to register: ${esc(REDIRECT)}<br>Scopes: esi-location.read_ship_type.v1 esi-assets.read_assets.v1</span>`);
  $('lb').onclick=login;
}
(async()=>{
  if(DEMO){render(demoModel());return}
  if(!CLIENT_ID){showLogin('NO CLIENT ID – add ?client_id=YOUR_ID to the URL');return}
  try{await handleCallback()}catch(e){showLogin('LOGIN FAILED: '+(e&&e.message||e));return}
  const run=async()=>{try{await liveLoad()}catch(e){if(!curKey)message('AWAITING DATA')}};
  run();setInterval(run,30000);
})();
</script>
</body>
