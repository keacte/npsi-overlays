<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>NPSI.ROCKS – New Eden Weather</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* OBS Browser Source 1920x1080 – full-screen splash (opaque). Options: ?seconds=10  ?minutes=5 (countdown)  ?loc=tama (lock one location) */
:root{--bg:#050308;--purple:#8a3ffc;--violet:#b98bff;--glow:#a35cff;--dim:#2a1747;--white:#f4efff;--red:#ff2a2a;--ac:#a65cff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#050308;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;font-family:'Rajdhani','Segoe UI',sans-serif;color:var(--white);
  background:radial-gradient(ellipse at 50% 55%,#150a2b 0%,#0a0516 55%,#050308 100%)}
@keyframes blink{50%{opacity:.15}}
.neb{position:absolute;inset:-20%;mix-blend-mode:screen;filter:blur(40px);will-change:transform}
.n1{background:radial-gradient(ellipse 38% 30% at 22% 30%,rgba(138,63,252,.45),transparent 70%),radial-gradient(ellipse 30% 26% at 75% 75%,rgba(98,40,200,.4),transparent 70%);animation:d1 90s ease-in-out infinite alternate}
.n2{background:radial-gradient(ellipse 34% 24% at 80% 22%,rgba(185,139,255,.25),transparent 70%);animation:d2 120s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(4%,-3%) scale(1.08)}}@keyframes d2{to{transform:translate(-5%,3%) scale(1.12)}}
#stars{position:absolute;inset:0}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(2,1,6,.7) 100%);pointer-events:none}
/* header */
#logo{position:absolute;left:50%;top:22px;height:104px;transform:translateX(-50%);z-index:5;filter:drop-shadow(0 0 14px rgba(163,92,255,.75))}
#title{position:absolute;left:60px;top:26px;z-index:5}
#title h1{font:900 54px/1 'Orbitron';letter-spacing:6px;color:#fff;text-shadow:0 0 24px rgba(163,92,255,.9),0 0 60px rgba(138,63,252,.6)}
#title h1 span{color:var(--violet)}
#title p{margin-top:10px;font:600 16px 'Orbitron';letter-spacing:4px;color:#a898c4}
#badge{position:absolute;right:60px;top:36px;z-index:5;border:1px solid var(--purple);padding:12px 22px;background:rgba(5,3,8,.65);font:600 18px 'Orbitron';letter-spacing:4px;display:flex;gap:16px;align-items:center}
#badge i{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red);animation:blink 1.2s steps(2) infinite}
#badge small{font:600 13px 'Orbitron';letter-spacing:3px;color:var(--violet)}
/* featured card */
#card{position:absolute;left:60px;top:150px;width:1140px;height:600px;border:1px solid var(--ac);background:rgba(8,4,18,.78);box-shadow:0 0 40px rgba(0,0,0,.5),inset 0 0 60px rgba(138,63,252,.08);z-index:3;overflow:hidden;transition:border-color .6s,box-shadow .6s}
#card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--ac);box-shadow:0 0 20px var(--ac);transition:background .6s}
#fx{position:absolute;inset:0;opacity:.9;pointer-events:none}
#cin{position:absolute;inset:0;padding:30px 36px 0 44px;display:grid;grid-template-columns:1fr 480px;gap:30px}
#cin.sw>*{animation:swap .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes swap{from{opacity:0;transform:translateX(-30px)}}
#cin.sw #pic{animation:swap2 .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes swap2{from{opacity:0;transform:translateX(40px) scale(.94);filter:blur(6px)}}
.lab{font:600 15px 'Orbitron';letter-spacing:6px;color:var(--ac);display:flex;align-items:center;gap:10px}
.lab i{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:blink 1.4s steps(2) infinite}
#lname{margin-top:12px;font:900 64px/1.05 'Orbitron';letter-spacing:3px;color:#fff;white-space:nowrap;text-shadow:0 0 22px var(--ac)}
#lreg{margin-top:8px;font:600 20px 'Orbitron';letter-spacing:4px;color:#a898c4}
#lreg b{color:var(--ac);font-weight:700}
#big{margin-top:14px;display:flex;align-items:baseline;gap:16px}
#big b{font:900 104px/1 'Orbitron';color:#fff;text-shadow:0 0 30px var(--ac);letter-spacing:2px}
#big span{font:700 20px/1.15 'Orbitron';letter-spacing:3px;color:var(--ac);max-width:240px}
#cond{margin-top:10px;font:700 36px/1.1 'Oxanium';color:var(--violet)}
#txt{margin-top:10px;font:500 22px/1.28 "Rajdhani";color:#d9cdf2;max-width:600px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
#met{position:absolute;left:44px;right:36px;bottom:70px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
#met div{border:1px solid var(--dim);border-left:3px solid var(--ac);background:rgba(5,3,8,.7);padding:9px 12px}
#met small{display:block;font:500 11px 'Orbitron';letter-spacing:3px;color:#8a7bb0;white-space:nowrap}
#met b{display:block;margin-top:4px;font:700 22px/1 'Oxanium';color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#met b.bad{color:#ff4a5a}
#quote{position:absolute;left:44px;right:36px;bottom:16px;font:500 15px 'Rajdhani';letter-spacing:.06em;color:#a898c4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#quote em{color:var(--ac);font-style:normal;font-weight:700}
/* picture */
#pic{position:relative;align-self:start;margin-top:4px;height:396px;border:1px solid var(--ac);background:#06030d;overflow:hidden}
#pic .planet{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--ac),rgba(30,10,60,.9) 70%);opacity:.55;filter:blur(1px)}
#pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:flt 7s ease-in-out infinite;filter:drop-shadow(0 0 22px rgba(0,0,0,.8))}
@keyframes flt{50%{transform:translateY(-10px) scale(1.03)}}
#pic:after{content:'';position:absolute;left:0;right:0;height:60px;top:-60px;background:linear-gradient(180deg,transparent,rgba(166,92,255,.22),transparent);animation:scan 4.5s linear infinite}
@keyframes scan{to{top:100%}}
#pic i{position:absolute;width:22px;height:22px;border:2px solid var(--ac);z-index:2}
#pic i.a{left:6px;top:6px;border-right:0;border-bottom:0}#pic i.b{right:6px;top:6px;border-left:0;border-bottom:0}
#pic i.c{left:6px;bottom:6px;border-right:0;border-top:0}#pic i.d{right:6px;bottom:6px;border-left:0;border-top:0}
#cap{position:absolute;left:0;right:0;bottom:0;padding:8px 14px;background:linear-gradient(0deg,rgba(5,3,8,.95),transparent);font:600 13px/1.25 'Orbitron';letter-spacing:2px;color:#cdb4ff;z-index:2}
#picl{margin-top:8px;font:500 11px 'Orbitron';letter-spacing:3px;color:#6f5f93;text-align:right}
#prog{position:absolute;left:0;bottom:0;height:3px;background:var(--ac);box-shadow:0 0 10px var(--ac);width:0;z-index:4}
/* list */
#list{position:absolute;left:1240px;top:150px;width:620px;height:600px;z-index:3;display:flex;flex-direction:column;gap:6px}
#list h3{font:700 15px 'Orbitron';letter-spacing:6px;color:var(--violet);height:26px;display:flex;justify-content:space-between}
#list h3 span{color:#6f5f93;letter-spacing:3px}
.row{flex:1;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:0 16px;border:1px solid var(--dim);border-left:3px solid var(--rc);background:rgba(8,4,18,.7);transition:all .4s;position:relative;overflow:hidden}
.row.on{background:linear-gradient(90deg,rgba(138,63,252,.28),rgba(8,4,18,.85));border-color:var(--rc);box-shadow:0 0 22px rgba(138,63,252,.35)}
.row b{display:block;font:800 24px/1 'Oxanium';letter-spacing:2px;color:#fff;text-transform:uppercase}
.row small{display:block;margin-top:4px;font:600 14px 'Rajdhani';letter-spacing:.1em;color:#a898c4;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px}
.row em{font:900 26px 'Orbitron';font-style:normal;color:var(--rc);text-shadow:0 0 12px var(--rc);text-align:right;white-space:nowrap}
/* outlook */
#out{position:absolute;left:60px;right:60px;top:776px;height:214px;z-index:3}
#out h3{font:700 15px 'Orbitron';letter-spacing:6px;color:var(--violet);height:28px}
#days{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;height:176px}
.day{border:1px solid var(--dim);background:rgba(8,4,18,.75);padding:12px 16px;position:relative;overflow:hidden}
.day:first-child{border-color:var(--purple);background:linear-gradient(180deg,rgba(138,63,252,.22),rgba(8,4,18,.8))}
.day small{font:700 14px 'Orbitron';letter-spacing:4px;color:var(--violet)}
.day b{display:block;margin-top:6px;font:800 24px/1.05 'Oxanium';color:#fff}
.day p{margin-top:6px;font:500 17px/1.2 'Rajdhani';color:#bfb0dd}
.day span{position:absolute;right:12px;top:10px;font:700 14px 'Orbitron';color:var(--violet);letter-spacing:1px}
/* ticker */
#tk{position:absolute;left:0;right:0;bottom:0;height:52px;background:#000;border-top:1px solid var(--purple);z-index:6;display:flex;align-items:center}
#tk .tag{flex:none;height:100%;padding:0 24px;display:flex;align-items:center;gap:12px;background:var(--red);color:#fff;font:900 17px 'Orbitron';letter-spacing:4px}
#tk .wrap{flex:1;overflow:hidden;white-space:nowrap}
#tk .rail{display:inline-block;font:600 20px 'Orbitron';letter-spacing:3px;color:#d9cdf2;animation:tick 150s linear infinite}
@keyframes tick{to{transform:translateX(-50%)}}
#tk .clk{flex:none;padding:0 26px;font:700 22px 'Orbitron';letter-spacing:3px;color:var(--violet)}
</style></head><body>

<script>

const QS=new URLSearchParams(location.search),$=id=>document.getElementById(id);
const SECONDS=Math.max(4,+QS.get('seconds')||10);
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= EDIT ME – every location is a real EVE Online place ================= */

const LOCS=[
 {id:'jita',name:'JITA',reg:'THE FORGE',sec:'0.9',ac:'#a65cff',fx:'rain',img:638,cap:'PICTURED: A RAVEN, BEING UNDERCUT BY A BIGGER RAVEN',
  big:'−0.01',unit:'ISK PER UNDERCUT',temp:'−0.01 ISK',cond:'Scams scattered, lag overcast',

  met:[['LAG INDEX','11 / 10',1],['SCAM RISK','SCATTERED'],['UNDOCK ODDS','3%',1],['TRADE HUB','OVERCROWDED']],

 {id:'perimeter',name:'PERIMETER',reg:'THE FORGE',sec:'0.9',ac:'#ff5a8a',fx:'cats',img:16240,cap:'PICTURED: TOMORROW’S FORECAST, IN SIXTEEN PIECES',
  big:'14',unit:'CATALYSTS IN ORBIT',temp:'14 CATS',cond:'Catalyst showers, smartbombs later',

  met:[['GATE CAMP','24 / 7',1],['CATS NEARBY','14'],['YOUR HULL','FORMER',1],['“GF” RATE','HIGH']],

 {id:'amarr',name:'AMARR',reg:'DOMAIN',sec:'1.0',ac:'#ffc83d',fx:'sun',img:642,cap:'PICTURED: SUNSHINE, BY IMPERIAL DECREE',
  big:'100%',unit:'MANDATORY SUNSHINE',temp:'100% SUN',cond:'Eternal sunshine (compulsory)',

  met:[['FAITH LEVEL','OVERFLOWING'],['HERESY','0.0%'],['RAINFALL','OUTLAWED'],['HALO','ISSUED']],

 {id:'rens',name:'RENS',reg:'HEIMATAR',sec:'0.9',ac:'#ff8a3d',fx:'rust',img:587,cap:'PICTURED: A RIFTER, DOING WHAT IT DOES BEST',

 {id:'tama',name:'TAMA',reg:'THE CITADEL',sec:'0.3',ac:'#b98bff',fx:'bubbles',img:29990,cap:'PICTURED: THE REGIONAL BIRD, “HEAVY MISSILE LOKI”',

  met:[['BUBBLES','97%',1],['LOKIS','SEVERAL'],['NEUTRALS','FEW'],['TRIAGE','NOT AVAILABLE',1]],
  q:'NPSI Surface Observer: “Visibility is good. Everyone is purple. Weapons free.”'},
 {id:'pochven',name:'POCHVEN',reg:'TRIGLAVIAN SPACE',sec:'−1.0',ac:'#ff2b3d',fx:'storm',img:2017,cap:'PICTURED: A PLANET THAT HAS SEEN THINGS',
  big:'100%',unit:'CHANCE OF TRIGLAVIANS',temp:'RED, ALWAYS',cond:'Permanent red storm, no refunds',
  txt:'The sky over Pochven has been red since the invasion and meteorologists are asked not to call it “a nice sunset”. Exits: three. Seats: none. Filaments advised. Hope not advised.',
  met:[['SKY','RED',1],['EXITS','THREE'],['FILAMENTS','ADVISED'],['MOOD','TRIGLAVIAN']],

 {id:'thera',name:'THERA',reg:'WORMHOLE SPACE',sec:'W-SPACE',ac:'#4fd6ff',fx:'hole',img:30889,cap:'PICTURED: THERA, PROBABLY',
  big:'62',unit:'FRESH WORMHOLES TODAY',temp:'62 HOLES',cond:'Mass: critical. Mood: rolling',
  txt:'Wormhole conditions are about to collapse directly behind you. A high-mass front is crossing the system; if your Rorqual is on the wrong side, the forecast says “oh no”. Rolling advised. Panic optional.',
  met:[['MASS','CRITICAL',1],['LIFETIME','< 4 HOURS',1],['EVICTIONS','LIKELY'],['HOME','CUT OFF',1]],
  q:'Scout Weather Desk: “I was just here a second ago. Who closed it?”'},
 {id:'delve',name:'DELVE',reg:'DELVE',sec:'−0.4',ac:'#5a8aff',fx:'calm',img:28352,cap:'PICTURED: A RORQUAL, MINING NOTHING IN PERFECT SAFETY',
  big:'0',unit:'THINGS HAPPENING',temp:'0 EVENTS',cond:'Blue donuts, light ratting',
  txt:'A calm, blue, high-pressure ridge is settled over the region. Nothing is expected to happen, and everyone is working very hard on it. Drizzle of anomalies, chance of coffee. Excitement index: sleeping.',
  met:[['EXCITEMENT','NONE'],['DONUTS','BLUE'],['DRIFTING','STEADY'],['COFFEE','REQUIRED',1]],
  q:'Delve Chamber of Commerce: “It’s not boring, it’s peaceful. Please stop asking.”'}
];
const DAYS=[
 ['TODAY','Partly Jita, mostly lag','Scam showers by evening. High of 11.0 lag, low of 0.01 ISK.','~'],
 ['DOWNTIME','11:00 UTC. Nothing.','100% chance of nothing. Dress for the login queue.','!'],
 ['PATCH DAY','Cloudy with a chance of nerfs','Your ship is expected to lose 5% of whatever you liked about it.','%'],
 ['DOUBLE-TAP','Thunder, then lightning','Forecast: Titan. Then another Titan. Then a very long killmail.','Ω'],
 ['WEEKEND','Hot drop warm front','Moving in from the east at 0.8 AU/s. Bring friends, snacks, and a spare cruiser.','☼']
];
const ALERTS=['WARNING: A 14-CATALYST GANG IS APPROACHING THE JITA GATE. THEY ARE NOT HERE FOR THE VIEW','FLASH FLOOD OF UNDERCUTS IN THE FORGE: SELLERS ARE URGED TO REMAIN CALM AND UNDERCUT BY 0.01 ISK','FOG ADVISORY IN THE DOMAIN: IT IS NOT FOG, IT IS A HOLY AEROSOL','NPSI REMINDER: NOT PURPLE, SHOOT IT. PURPLE, DO NOT SHOOT IT. THE FORECAST IS SIMPLE','ROCKS FALLING OVER RENS: EXPECT FALLING ROCKS, EVEN IN STATIONS','POCHVEN SKY REMAINS RED. WE HAVE STOPPED ASKING WHY','THUNDERSTORM WARNING IN FEDERATION SPACE: THE THUNDER IS A DREADNOUGHT','CAPSULEER SAFETY NOTICE: UMBRELLAS ARE NOT ACCEPTED AS INSURANCE','INSURANCE DOES NOT PAY OUT FOR ACTS OF GOD, ACTS OF MOM, OR ACTS OF ‘IT WAS A SAFE SPOT’','TSUNAMI OF FRIGATES ADVANCING ON AMAMAKE. EVACUATE YOUR CRUISERS','THERA WORMHOLE FORECAST: IT WAS THERE JUST NOW','WIND SPEED: 3.0 AU/S. WIND DIRECTION: TOWARDS A BUBBLE','TEMPERATURE: 98% HEAT, 2% HOPE','COLD FRONT MOVING IN OVER THE ASTEROID BELT. THE MINERS ARE FINE. THE MINERS ARE ALWAYS FINE','THIS FORECAST MAY CONTAIN PILOTS. SOME PILOTS MAY CONTAIN LAG','CYNO LIGHTNING EXPECTED. IT WILL NOT STRIKE TWICE; IT WILL STRIKE FORTY-FIVE TIMES','WEATHER ACCURACY: 4%. A NEW RECORD'];
/* ===================================================================================== */
const SC=document.getElementById.bind(document);
let i=0,locked=QS.get('loc');
const L0=LOCS.findIndex(l=>l.id===locked);
$('list').innerHTML=`<h3>NEW EDEN NOW <span>REGIONAL</span></h3>`+LOCS.map((l,k)=>`<div class="row" data-k="${k}" style="--rc:${l.ac}"><div><b>${esc(l.name)}</b><small>${esc(l.cond)}</small></div><em>${esc(l.temp)}</em></div>`).join('');
const wd=['SUN','MON','TUE','WED','THU','FRI','SAT'];
$('days').innerHTML=DAYS.map((d,k)=>{const dn=k===0?'TODAY':k===1?'DOWNTIME':d[0];return`<div class="day"><span>${esc(d[3])}</span><small>${esc(dn)}</small><b>${esc(d[1])}</b><p>${esc(d[2])}</p></div>`}).join('');
const ar=ALERTS.map(a=>`<span>${esc(a)}</span><span style="color:#8a3ffc;margin:0 26px">◆</span>`).join('');
$('rail').innerHTML=ar+ar;
setInterval(()=>{$('clk').textContent=new Date().toISOString().substr(11,8)+' UTC'},1000);
/* countdown */
const MIN=+QS.get('minutes')||0,T0=Date.now();
if(MIN){const tick=()=>{const left=Math.max(0,MIN*60-Math.round((Date.now()-T0)/1000)),m=String(Math.floor(left/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0');$('cd').textContent=left?`T-${m}:${s}`:'';$('bt').textContent=left?'STREAM STARTING SOON':'NOW BROADCASTING'};tick();setInterval(tick,1000)}
/* picture */
function show(k){
  const l=LOCS[k];i=k;
  document.documentElement.style.setProperty('--ac',l.ac);
  $('card').style.borderColor=l.ac;
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('on',+r.dataset.k===k));
  const c=$('cin');
  c.innerHTML=`<div><div class="lab"><i></i>CURRENT CONDITIONS</div><div id="lname">${esc(l.name)}</div><div id="lreg">${esc(l.reg)} · SEC <b>${esc(l.sec)}</b></div>
   <div id="big"><b>${esc(l.big)}</b><span>${esc(l.unit)}</span></div><div id="cond">${esc(l.cond)}</div><div id="txt">${esc(l.txt)}</div></div>
   <div><div id="pic"><div class="planet"></div><img alt="" id="pimg" src="https://images.evetech.net/types/${l.img}/render?size=512"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><div id="cap">${esc(l.cap)}</div></div><div id="picl">IMAGE: CCP GAMES / EVE ONLINE</div></div>
   <div id="met">${l.met.map(m=>`<div><small>${esc(m[0])}</small><b class="${m[2]?'bad':''}">${esc(m[1])}</b></div>`).join('')}</div>
   <div id="quote"><em>▮</em> ${esc(l.q)}</div>`;
  c.classList.remove('sw');void c.offsetWidth;c.classList.add('sw');
  const im=$('pimg');im.onerror=()=>{im.onerror=()=>{im.style.display='none'};im.src=`https://images.evetech.net/types/${l.img}/icon?size=512`};
  const nm=$('lname');nm.style.fontSize='64px';let f=64;while(nm.scrollWidth>nm.parentElement.clientWidth&&f>28){f-=2;nm.style.fontSize=f+'px'}
  fxMode=l.fx;parts.length=0;
  const p=$('prog');p.style.transition='none';p.style.width='0';void p.offsetWidth;p.style.transition=`width ${SECONDS}s linear`;p.style.width='100%';
}
/* weather FX (canvas over the card) */
const fx=$('fx'),g=fx.getContext('2d');let fxMode='rain';const parts=[];const W=1140,H=600;
const R=(a,b)=>a+Math.random()*(b-a);
function spawn(){
  const m=fxMode;
  if(m==='rain'||m==='storm'){parts.push({x:R(0,W),y:-10,vx:m==='storm'?-90:-20,vy:R(520,820),l:R(14,30)})}
  else if(m==='cats'){parts.push({x:R(0,W),y:-20,vx:R(-20,20),vy:R(80,170),r:R(5,11),a:R(0,6.28),w:R(-2,2)})}
  else if(m==='bubbles'){parts.push({x:R(0,W),y:H+20,vx:R(-12,12),vy:R(-60,-25),r:R(8,34),a:R(.15,.4)})}
  else if(m==='sun'){parts.push({x:R(0,W),y:R(0,H),vx:R(-6,6),vy:R(-24,-8),r:R(1,3),a:R(.3,.8),life:R(2,5),t:0})}
  else if(m==='rust'){parts.push({x:R(0,W),y:H+10,vx:R(-30,10),vy:R(-90,-30),r:R(1.2,3),a:R(.4,.9),life:R(2,5),t:0})}
  else if(m==='hole'){const a=R(0,6.28),d=R(260,560);parts.push({x:W*.78+Math.cos(a)*d,y:H*.5+Math.sin(a)*d*.55,a,d,r:R(1,2.6)})}
  else{parts.push({x:R(0,W),y:R(0,H),vx:R(8,26),vy:R(-6,6),r:R(1,3),a:R(.2,.6),life:R(5,9),t:0})}
}
let flash=0,last=performance.now(),acc=0;
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;g.clearRect(0,0,W,H);
  const col=LOCS[i].ac;
  if(fxMode==='sun'){const gr=g.createRadialGradient(W*.15,-60,10,W*.15,-60,720);gr.addColorStop(0,'rgba(255,214,90,.35)');gr.addColorStop(1,'rgba(255,200,61,0)');g.fillStyle=gr;g.fillRect(0,0,W,H)}
  if(fxMode==='storm'){if(Math.random()<dt*.35)flash=1;if(flash>0){g.fillStyle=`rgba(255,43,61,${flash*.28})`;g.fillRect(0,0,W,H);flash-=dt*3}}
  if(fxMode==='hole'){g.save();g.translate(W*.78,H*.5);g.rotate(now/9000);for(let r=0;r<4;r++){g.strokeStyle=hexA(col,.18-r*.03);g.lineWidth=2;g.beginPath();g.ellipse(0,0,120+r*80,60+r*40,0,0,6.28);g.stroke()}g.restore()}
  const rate={rain:120,storm:180,cats:10,bubbles:5,sun:14,rust:16,hole:40,calm:6}[fxMode]||8;
  acc+=rate*dt;while(acc>=1){spawn();acc--}
  for(let k=parts.length-1;k>=0;k--){const p=parts[k];
    if(fxMode==='hole'){p.d-=60*dt;p.a+=.5*dt;p.x=W*.78+Math.cos(p.a)*p.d;p.y=H*.5+Math.sin(p.a)*p.d*.55;if(p.d<10){parts.splice(k,1);continue}g.fillStyle=hexA(col,Math.min(.9,1-p.d/600+.2));g.beginPath();g.arc(p.x,p.y,p.r,0,6.28);g.fill();continue}
    p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;
    if(p.life!==undefined){p.t+=dt;if(p.t>p.life){parts.splice(k,1);continue}}
    if(p.y>H+40||p.y<-60||p.x<-60||p.x>W+60){parts.splice(k,1);continue}
    if(fxMode==='rain'||fxMode==='storm'){g.strokeStyle=fxMode==='storm'?'rgba(255,80,90,.55)':hexA(col,.5);g.lineWidth=1.5;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-p.vx*p.l/p.vy,p.y-p.l);g.stroke()}
    else if(fxMode==='cats'){p.a+=p.w*dt;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=hexA(col,.55);g.beginPath();g.moveTo(0,-p.r*1.6);g.lineTo(p.r,p.r);g.lineTo(-p.r,p.r);g.closePath();g.fill();g.restore()}
    else if(fxMode==='bubbles'){g.strokeStyle=hexA(col,p.a+.2);g.lineWidth=1.5;g.fillStyle=hexA(col,p.a*.2);g.beginPath();g.arc(p.x,p.y,p.r,0,6.28);g.fill();g.stroke()}
    else{g.fillStyle=(fxMode==='rust'?`rgba(255,138,61,${p.a*(1-p.t/p.life)})`:fxMode==='sun'?`rgba(255,214,90,${p.a*(1-p.t/p.life)})`:hexA(col,p.a*(1-p.t/p.life)));g.beginPath();g.arc(p.x,p.y,p.r,0,6.28);g.fill()}
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
show(L0>=0?L0:0);
if(L0<0)setInterval(()=>show((i+1)%LOCS.length),SECONDS*1000);
/* background stars */
const sc=$('stars'),sg=sc.getContext('2d');
const stars=Array.from({length:320},()=>({x:R(0,1920),y:R(0,1080),r:R(.4,1.8),t:R(0,6.28),s:R(.5,2),v:R(2,10)}));
(function st(now){sg.clearRect(0,0,1920,1080);for(const s of stars){s.x-=s.v*.016;if(s.x<-3)s.x=1923;sg.globalAlpha=.3+.7*(.5+.5*Math.sin(s.t+now/1000*s.s))*.8;sg.fillStyle='#e2d0ff';sg.beginPath();sg.arc(s.x,s.y,s.r,0,6.28);sg.fill()}requestAnimationFrame(st)})(0);
